<title>Bordbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Auftragsblock aus der Werkstatt — Haarlinien und Flaechen in Graphit,
   Warnsignal-Gelb nur fuer das, was gerade laeuft oder gedrueckt wird,
   Beschriftungen in technischer Schmalschrift, alle Zahlen im Zaehlwerk-Monospace */
:root{
  --bg:#e9e7e2; --surface:#fbfaf8; --surface-2:#e2dfd8; --surface-3:#d5d1c9;
  --fg:#17191a; --muted:#696d70; --line:#cac6be; --hair:#b9b4ab;
  --signal:#e8a300; --signal-fg:#17191a;
  --ok:#2c6e49; --warn:#a9371a;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121415; --surface:#1b1e1f; --surface-2:#242829; --surface-3:#2f3435;
  --fg:#eceae6; --muted:#8c9194; --line:#2e3334; --hair:#3b4142;
  --signal:#f0b31f; --signal-fg:#17191a;
  --ok:#5fb98a; --warn:#dd7d5e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121415; --surface:#1b1e1f; --surface-2:#242829; --surface-3:#2f3435;
  --fg:#eceae6; --muted:#8c9194; --line:#2e3334; --hair:#3b4142;
  --signal:#f0b31f; --signal-fg:#17191a;
  --ok:#5fb98a; --warn:#dd7d5e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-b);
  font-size:15.5px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:.005em}

/* Kopf */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-block:16px 0;border-bottom:1px solid var(--hair)}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:13px}
h1{font-size:25px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.proto{font-family:var(--font-m);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.today{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:8px 13px 9px;cursor:pointer;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--fg);background:none}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--signal)}
main{padding-block:20px}

/* Abschnitte */
.sec{margin-bottom:20px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sechead h2{font-family:var(--font-d);font-size:13px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sechead::after{content:"";flex:1;height:1px;background:var(--hair);order:1}
.sechead>*:not(h2){order:2;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card+.card{margin-top:9px}
.lbl{display:block;font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{min-height:58px;resize:vertical;font-family:var(--font-b);font-size:15px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=number],input[type=date],input[type=time]{font-family:var(--font-m);font-size:14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--signal);outline-offset:1px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}.g3.keep{grid-template-columns:1fr 1fr}
  .daysum{flex-wrap:wrap}.daysum span{margin-left:0;width:100%}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* Knoepfe */
button{font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:8px 14px}
button:hover{border-color:var(--hair);background:var(--surface-3)}
.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-fg)}
.primary:hover{background:var(--signal);border-color:var(--signal);filter:brightness(1.07)}
.ghost{background:none}
.ghost:hover{background:var(--surface-2)}
.mini{font-size:12px;padding:5px 10px}
.icon{padding:5px 8px;font-size:13px;line-height:1;color:var(--muted);background:none;border-color:transparent}
.icon:hover{color:var(--warn);background:var(--surface-2);border-color:transparent}

/* Text */
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-d);font-size:13.5px;font-weight:600;
  letter-spacing:.04em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;
  padding:6px 11px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--signal);background:var(--surface-3)}
.badge{display:inline-block;font-family:var(--font-m);font-size:10px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 6px;border-radius:3px;background:var(--surface-3);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.acc{background:var(--signal);color:var(--signal-fg)}

/* Klappen */
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:9px}
details>summary{font-family:var(--font-d);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:12px 15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--font-m);font-size:14px;line-height:1}
details[open]>summary{color:var(--fg);border-bottom:1px solid var(--line)}
details[open]>summary::after{content:"\2212"}
details>summary:hover{color:var(--fg)}
details .inner{padding:15px}

/* Kalender */
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.calnav button{border-color:transparent;background:none;font-family:var(--font-m);font-size:17px;padding:4px 10px}
.calnav button:hover{background:var(--surface-2)}
.calnav .t{flex:1;text-align:center;font-family:var(--font-d);font-weight:600;font-size:17px;letter-spacing:.02em}
.calnav .t span{display:block;font-family:var(--font-m);font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 2px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fg)}
.wd:hover{border-color:var(--hair)}
.wd .n{font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wd .d{font-family:var(--font-m);font-size:17px;font-weight:500;letter-spacing:-.03em;line-height:1}
.wd .l{width:62%;height:3px;border-radius:0;background:var(--surface-3);overflow:hidden}
.wd .l i{display:block;height:100%;background:var(--muted)}
.wd .l i.full{background:var(--warn)}
.wd.we{background:var(--bg)}
.wd.heute{border-color:var(--signal)}
.wd.heute .n{color:var(--fg)}
.wd.sel,.wd.we.sel{background:var(--fg);border-color:var(--fg)}
.wd.sel .n,.wd.sel .d{color:var(--bg)}
.wd.sel .l{background:color-mix(in srgb,var(--bg) 30%,transparent)}
.wd.sel .l i{background:var(--signal)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .mh{font-family:var(--font-d);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-align:center;padding-bottom:3px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-height:54px;padding:6px 4px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg)}
.mc:hover{border-color:var(--hair)}
.mc .d{font-family:var(--font-m);font-size:13px;font-weight:500;letter-spacing:-.02em;line-height:1}
.mc.out{opacity:.34}
.mc.heute{border-color:var(--signal)}
.mc.sel{background:var(--fg);border-color:var(--fg)}
.mc.sel .d{color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:5px;height:5px;border-radius:0;background:var(--muted);display:block}
.dots i.done{background:var(--ok)}
.mc.sel .dots i{background:var(--signal)}

/* Tag */
.daysum{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.daysum h3{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.02em}
.daysum span{margin-left:auto;white-space:nowrap}
.termin{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fg);
  border-radius:0 var(--r) var(--r) 0;padding:12px 13px;margin-bottom:6px}
.termin.done{border-left-color:var(--ok);opacity:.68}
.termin .t1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.termin .zeit{font-family:var(--font-m);font-weight:500;font-size:14px;letter-spacing:-.02em}
.termin strong{font-weight:600}
.frei{border:1px solid var(--line);border-left:4px solid transparent;border-radius:0 var(--r) var(--r) 0;
  padding:9px 13px;margin-bottom:6px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--surface-2) 7px 14px)}
.frei span:first-child{font-family:var(--font-d);font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

/* Verlauf */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat.warnstat{border-color:var(--warn)}
.stat.warnstat .v{color:var(--warn)}
.zahlzeile{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid var(--line);
  margin-top:13px;padding-top:12px}
.zahlzeile .seg{margin-right:auto}
@media (max-width:520px){.zahlzeile .seg{margin-right:0;width:100%}.zahlzeile .seg button{flex:1}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.stat .k{font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-m);font-size:21px;font-weight:500;letter-spacing:-.03em;margin-top:2px;line-height:1.15}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}}
.vgh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.vgh h3{font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.02em}
.vgh .num,.vgh span.num{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.vz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:6px}
.vz .z1{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.vz .dat{font-family:var(--font-m);font-size:13px;color:var(--muted)}
.vz strong{font-weight:600}
.vz .su{margin-left:auto;font-family:var(--font-m);font-size:15px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}

/* Kleine Felder in Zeilen */
.fieldlet{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-d);font-size:12.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp-mini{width:76px;padding:4px 7px;font-family:var(--font-m);font-size:13px;border-radius:3px;
  background:var(--bg);text-transform:none;letter-spacing:-.02em}
.inp-mini.leer{border-color:var(--warn)}
.teileliste{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tl{font-size:13px;color:var(--fg)}
.tl .num{font-size:12.5px}

/* Positionen */
.pos{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:11px 0;border-top:1px solid var(--line)}
.pos:first-child{border-top:0;padding-top:0}
.pos .nm{font-weight:600}
.pos .amt{font-family:var(--font-m);font-size:15px;font-weight:500;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.pos .sub{grid-column:1;font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pos .acts{grid-column:2;display:flex;gap:3px;justify-content:flex-end;align-items:center;margin-top:1px}
.zwisum{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--hair);margin-top:11px;padding-top:10px;
  font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.zwisum span:last-child{font-family:var(--font-m);font-size:15px;font-weight:500;letter-spacing:-.02em;text-transform:none}
.gesamt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-top:9px}
.gesamt .r{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:14.5px}
.gesamt .r span:last-child{font-family:var(--font-m);letter-spacing:-.02em}
.gesamt .t{border-top:3px double var(--fg);margin-top:9px;padding-top:10px;
  font-family:var(--font-d);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.gesamt .t span:last-child{font-family:var(--font-m);font-size:23px;font-weight:500;letter-spacing:-.03em;text-transform:none}

/* Auftragskopf */
.kopf{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.kopf .fz{font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.15}
.kopf .betrag{font-family:var(--font-m);font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);padding:8px 14px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pb{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.pb:first-child{border-top:0;padding-top:0}
.pb strong{font-weight:600}

/* Dokument */
.doc{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:22px 20px}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:3px double var(--fg);padding-bottom:13px;margin-bottom:16px}
.doc h2{font-family:var(--font-d);font-size:27px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:0 0 3px}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px}
.doc th{text-align:left;font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--hair);padding:0 0 7px}
.doc td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc td.r,.doc th.r{text-align:right;font-family:var(--font-m);letter-spacing:-.02em;white-space:nowrap;padding-left:10px}
.doc th.r{font-family:var(--font-d);letter-spacing:.12em}
.doc tr.grp td{border-bottom:0;padding:16px 0 3px;font-family:var(--font-d);font-size:12px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.doc td strong{font-weight:600}
.tw{overflow-x:auto}
.note{background:var(--surface-2);border-left:4px solid var(--signal);border-radius:0 4px 4px 0;
  padding:11px 13px;font-size:13.5px;margin-top:15px;line-height:1.45}
.check{list-style:none;padding:0;margin:9px 0 0;font-size:13.5px;display:grid;gap:4px}
.check li::before{content:"\2713";color:var(--ok);font-weight:700;display:inline-block;width:1.2em}
.check li.miss::before{content:"\2715";color:var(--warn)}
.check li.miss{color:var(--warn)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13.5px;line-height:1.6}
footer{border-top:1px solid var(--hair);margin-top:28px;padding-top:15px;font-size:12.5px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <div class="brandrow">
      <h1>Bordbuch</h1>
      <span class="proto">Prototyp</span>
      <span class="today num" id="today"></span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-a="tab" data-v="kalender">Kalender</button>
      <button class="tab" role="tab" data-a="tab" data-v="auftrag">Auftrag</button>
      <button class="tab" role="tab" data-a="tab" data-v="verlauf">Verlauf</button>
      <button class="tab" role="tab" data-a="tab" data-v="preisbuch">Preisbuch</button>
      <button class="tab" role="tab" data-a="tab" data-v="dokument">Dokument</button>
      <button class="tab" role="tab" data-a="tab" data-v="einstellungen">Einstellungen</button>
    </div>
  </div>
  <main id="main"></main>
  <datalist id="dl-arbeit"></datalist>
  <datalist id="dl-teile"></datalist>
  <footer>
    Prototyp zum Durchklicken. Die Dauer-Vorschläge kommen aus einer eingebauten Tabelle mit Erfahrungswerten —
    nicht aus DAT oder Audatex. Alles bleibt in diesem Browser.
  </footer>
</div>

<script>
/* ---------- Dauer-Tabelle: Erfahrungswerte in Minuten ---------- */
const JOBS=[
 {n:'Ölwechsel mit Filter',m:30,k:['öl','olwechsel','ölwechsel','ölservice','inspektion klein']},
 {n:'Bremsbeläge vorne',m:45,k:['bremsbelage vorne','belage vorne']},
 {n:'Bremsbeläge + Scheiben vorne',m:60,k:['bremsen vorne','scheiben vorne','bremsscheiben vorne']},
 {n:'Bremsbeläge hinten',m:45,k:['bremsbelage hinten','belage hinten']},
 {n:'Bremsbeläge + Scheiben hinten',m:60,k:['bremsen hinten','scheiben hinten','bremsscheiben hinten']},
 {n:'Bremsflüssigkeit wechseln',m:45,k:['bremsflussigkeit','bremsflüssigkeit']},
 {n:'Bremssattel erneuern',m:75,k:['bremssattel','sattel']},
 {n:'Handbremsseil',m:60,k:['handbremse','handbremsseil']},
 {n:'Generator / Lichtmaschine',m:90,k:['generator','lichtmaschine','lima','alternator']},
 {n:'Anlasser / Starter',m:75,k:['anlasser','starter']},
 {n:'Batterie wechseln',m:20,k:['batterie','akku']},
 {n:'Keilrippenriemen',m:60,k:['keilrippenriemen','keilriemen']},
 {n:'Zahnriemen mit Wasserpumpe',m:240,k:['zahnriemen','riemenwechsel']},

function findJob(q){
  const n=norm(q); if(n.length<2) return null;
  let best=null,score=0;
  for(const j of JOBS) for(const key of [norm(j.n),...j.k.map(norm)]){
    let s=0;
    if(n===key) s=key.length+100; else if(n.includes(key)) s=key.length+20; else if(key.includes(n)) s=n.length;
    if(s>score){score=s;best=j}
  }

}

function renderKalender(){
  const kap=kapazitaet();
  let h='<div class="sec"><div class="row spread" style="margin-bottom:10px">'+
    '<div class="seg"><button data-a="calmode" data-v="woche" aria-pressed="'+(S.calMode==='woche')+'">Woche</button>'+

    '<button class="mini ghost" data-a="cal-heute">Heute</button></div>';

  if(S.calMode==='woche'){
    h+='<div class="calnav"><button class="icon" data-a="cal-prev" aria-label="Woche zurück">‹</button>'+
      '<div class="t">'+esc(wochenTitel(S.woche))+'<span>Kalenderwoche '+kw(S.woche)+'</span></div>'+
      '<button class="icon" data-a="cal-next" aria-label="Woche vor">›</button></div><div class="week">';
    for(let i=0;i<7;i++){
      const d=plus(S.woche,i), b=belegt(d), pct=Math.min(100,Math.round(b/kap*100)), we=i>4;
      h+='<button class="wd'+(d===S.tag?' sel':'')+(d===heute()?' heute':'')+(we?' we':'')+'" data-a="cal-tag" data-d="'+d+'">'+
        '<span class="n">'+WTK[i]+'</span><span class="d">'+D(d).getDate()+'</span>'+
        '<span class="l"><i class="'+(pct>=100?'full':'')+'" style="width:'+pct+'%"></i></span></button>';
    }
    h+='</div>';
  } else {
    const [yy,mm]=S.monat.split('-').map(Number);
    const erster=yy+'-'+String(mm).padStart(2,'0')+'-01';
    const start=montag(erster), tageImMonat=new Date(yy,mm,0).getDate();
    const zellen=Math.ceil(((D(erster).getDay()+6)%7 + tageImMonat)/7)*7;
    h+='<div class="calnav"><button class="icon" data-a="cal-prev" aria-label="Monat zurück">‹</button>'+
      '<div class="t">'+MON[mm-1]+' '+yy+'<span>Monatsübersicht</span></div>'+
      '<button class="icon" data-a="cal-next" aria-label="Monat vor">›</button></div><div class="month">'+
      WTK.map(w=>'<div class="mh">'+w+'</div>').join('');
    for(let i=0;i<zellen;i++){
      const d=plus(start,i), tt=tagTermine(d), out=d.slice(0,7)!==S.monat;
      h+='<button class="mc'+(out?' out':'')+(d===S.tag?' sel':'')+(d===heute()?' heute':'')+'" data-a="cal-tag" data-d="'+d+'">'+
        '<span class="d">'+D(d).getDate()+'</span><span class="dots">'+
        tt.slice(0,4).map(t=>'<i class="'+(t.status==='erledigt'?'done':'')+'"></i>').join('')+'</span></button>';
    }
    h+='</div>';
  }
  h+='</div>';

  const list=tagTermine(S.tag), b=belegt(S.tag), pct=Math.min(100,Math.round(b/kap*100));
  h+='<div class="daysum"><h3>'+esc(tagLang(S.tag))+'</h3>'+
    '<span class="small muted num">'+std(b)+' von '+std(kap)+' · '+pct+'%</span></div>';

  if(!list.length){
    h+='<div class="card"><div class="empty">Kein Termin an diesem Tag.<br>'+
      '<span class="num">'+esc(S.settings.oeffnung.von)+'–'+esc(S.settings.oeffnung.bis)+'</span> ist frei.</div></div>';
  } else {
    let cursor=minVon(S.settings.oeffnung.von);
    const ende=minVon(S.settings.oeffnung.bis);
    list.forEach(t=>{
      const von=minVon(t.zeit), bis=von+(Number(t.dauer)||0);
      if(t.status!=='erledigt'&&von-cursor>=20&&von>cursor)
        h+='<div class="frei"><span>frei</span><span class="num">'+zeitVon(cursor)+'–'+zeitVon(von)+'</span></div>';
      h+='<div class="termin'+(t.status==='erledigt'?' done':'')+'">'+
        '<div class="t1"><span class="zeit">'+esc(t.zeit)+'–'+zeitVon(bis)+'</span>'+
        '<strong>'+esc(t.kunde||'Ohne Namen')+'</strong>'+
        (t.status==='erledigt'?'<span class="badge ok">erledigt</span>':'<span class="badge num">'+(Number(t.dauer)||0)+' min</span>')+'</div>'+
        '<div class="small muted" style="margin-top:3px">'+esc(t.fahrzeug||'—')+' · '+esc(t.arbeit||'—')+'</div>'+
        '<div class="row" style="margin-top:9px">'+
          '<button class="mini" data-a="t-auftrag" data-id="'+t.id+'">'+(t.auftragId?'Auftrag öffnen':'Auftrag anlegen')+'</button>'+
          '<button class="mini ghost" data-a="t-done" data-id="'+t.id+'">'+(t.status==='erledigt'?'Wieder offen':'Erledigt')+'</button>'+
          '<button class="icon" data-a="t-del" data-id="'+t.id+'" aria-label="Termin löschen">✕</button>'+
        '</div></div>';
      if(t.status!=='erledigt') cursor=Math.max(cursor,bis);
    });
    if(ende-cursor>=20) h+='<div class="frei"><span>frei</span><span class="num">'+zeitVon(cursor)+'–'+zeitVon(ende)+'</span></div>';
  }

  h+='<details><summary>Termin eintragen</summary><div class="inner">'+
    '<div class="grid g3 keep">'+
      '<div><label class="lbl" for="t-datum">Datum</label><input id="t-datum" type="date" value="'+S.tag+'"></div>'+
      '<div><label class="lbl" for="t-zeit">Uhrzeit</label><input id="t-zeit" type="time" value="09:00"></div>'+
      '<div><label class="lbl" for="t-dauer">Dauer (min)</label><input id="t-dauer" type="number" inputmode="numeric" min="5" step="5" value="60"></div>'+
    '</div><div class="grid g2" style="margin-top:10px">'+
      '<div><label class="lbl" for="t-kunde">Kunde</label><input id="t-kunde" placeholder="Name"></div>'+
      '<div><label class="lbl" for="t-fahrzeug">Fahrzeug</label><input id="t-fahrzeug" placeholder="z. B. VW Passat B8, 2017"></div>'+
    '</div><div style="margin-top:10px"><label class="lbl" for="t-arbeit">Arbeit</label>'+

      '<button class="primary" data-a="t-add">Termin anlegen</button></div>'+
    '<div class="hint" id="t-hint">Fahrzeug und Arbeit eintragen, dann schätzen — die Klasse wird aus dem Fahrzeug erkannt.</div>'+
    '</div></details>'+
    '<div class="note">Für die Kundenbuchung später: die freien Zeitfenster oben sind genau die Slots, '+
    'die ein Kunde selbst wählen könnte.</div>';

}

function freierPlatz(dauer){
  const von=minVon(S.settings.oeffnung.von), bis=minVon(S.settings.oeffnung.bis);
  for(let i=1;i<=28;i++){
    const d=plus(heute(),i), wt=(D(d).getDay()+6)%7;
    if(wt>4) continue;
    let cursor=von;
    tagTermine(d).filter(t=>t.status!=='erledigt').forEach(t=>{
      cursor=Math.max(cursor,minVon(t.zeit)+(Number(t.dauer)||0));
    });
    if(cursor+dauer<=bis) return {datum:d,zeit:zeitVon(cursor)};
  }
  return {datum:plus(heute(),1),zeit:S.settings.oeffnung.von};
}

/* ---------- Verlauf ---------- */
const fzSchluessel=f=>norm(f.kennzeichen)||norm(fzText(f));
function renderVerlauf(){
  const q=norm(S.suche||'');
  const alle=S.auftraege.filter(a=>a.positionen.length);
  const liste=alle.filter(a=>!q||norm([a.kunde,fzText(a.fahrzeug),a.fahrzeug.kennzeichen]
      .concat(a.positionen.map(p=>p.name)).join(' ')).includes(q))
    .sort((x,y)=>y.datum.localeCompare(x.datum));
  const ges=liste.reduce((x,a)=>x+summe(a).brutto,0);
  const min=liste.reduce((x,a)=>x+summe(a).minuten,0);
  const offenB=liste.filter(a=>zahlung(a).status!=='bezahlt').reduce((x,a)=>x+summe(a).brutto,0);
  const offenN=liste.filter(a=>zahlung(a).status!=='bezahlt').length;

  let h='<div class="stats">'+
    '<div class="stat"><div class="k">Reparaturen</div><div class="v">'+liste.length+'</div></div>'+
    '<div class="stat"><div class="k">Summe</div><div class="v">'+eur(ges)+'</div></div>'+
    '<div class="stat"><div class="k">Arbeitszeit</div><div class="v">'+std(min)+'</div></div>'+
    '<div class="stat'+(offenN?' warnstat':'')+'"><div class="k">Offen</div><div class="v">'+eur(offenB)+
    (offenN?'<span class="small muted"> · '+offenN+'×</span>':'')+'</div></div></div>';

  h+='<div class="row spread" style="margin-bottom:12px">'+
    '<div class="seg"><button data-a="vmodus" data-v="datum" aria-pressed="'+(S.vModus==='datum')+'">Nach Datum</button>'+
    '<button data-a="vmodus" data-v="fahrzeug" aria-pressed="'+(S.vModus==='fahrzeug')+'">Nach Fahrzeug</button></div>'+
    '<input id="v-suche" style="flex:1 1 180px;max-width:280px" placeholder="Suchen: Fahrzeug, Kunde, Arbeit" '+
    'value="'+esc(S.suche||'')+'" aria-label="Verlauf durchsuchen"></div>';

  if(!liste.length) return h+'<div class="card"><div class="empty">'+
    (q?'Nichts gefunden für „'+esc(S.suche)+'".':'Noch keine Reparatur erfasst.')+'</div></div>';

  const zeile=(a,kompakt)=>{
    const su=summe(a), arb=a.positionen.filter(p=>p.typ==='arbeit');
    const arbTxt=arb.length?arb.map(p=>p.name).join(' · '):'nur Teile';
    return '<div class="vz"><div class="z1"><span class="dat">'+esc(kurzDatum(a.datum))+esc(D(a.datum).getFullYear())+'</span>'+
      '<strong>'+esc(kompakt?arbTxt:fzText(a.fahrzeug))+'</strong>'+
      (!kompakt&&a.fahrzeug.kennzeichen?'<span class="badge">'+esc(a.fahrzeug.kennzeichen)+'</span>':'')+
      (zahlung(a).status!=='bezahlt'?'<span class="badge warn">unbezahlt</span>':'')+
      (a.id===S.aktiv?'<span class="badge acc">geöffnet</span>':'')+
      '<span class="su">'+eur(su.brutto)+'</span></div>'+
      '<div class="small muted" style="margin-top:3px">'+esc(a.kunde||'—')+
      (kompakt?'':' · '+esc(arbTxt))+
      (a.fahrzeug.km?' · '+Number(a.fahrzeug.km).toLocaleString('de-DE')+' km':'')+'</div>'+
      '<div class="row" style="margin-top:8px"><button class="mini ghost" data-a="v-open" data-id="'+a.id+'">Auftrag öffnen</button>'+
      '<span class="small muted num">'+std(su.minuten)+' Arbeit · '+eur(su.teile)+' Teile</span></div></div>';
  };

  if(S.vModus==='datum'){
    let jahr='';
    liste.forEach(a=>{
      const j=a.datum.slice(0,4);
      if(j!==jahr){jahr=j;h+='<div class="vgh"><h3>'+j+'</h3></div>'}
      h+=zeile(a);
    });
  } else {
    const gruppen={};
    liste.forEach(a=>{const k=fzSchluessel(a.fahrzeug);(gruppen[k]=gruppen[k]||[]).push(a)});
    Object.keys(gruppen)
      .sort((x,y)=>gruppen[y][0].datum.localeCompare(gruppen[x][0].datum))
      .forEach(k=>{
        const g=gruppen[k], f=g[0].fahrzeug;
        const sum=g.reduce((x,a)=>x+summe(a).brutto,0);
        const km=Math.max.apply(null,g.map(a=>Number(a.fahrzeug.km)||0));
        h+='<div class="vgh"><h3>'+esc(fzText(f))+'</h3>'+
          (f.kennzeichen?'<span class="badge">'+esc(f.kennzeichen)+'</span>':'')+
          '<span class="num">'+g.length+'× · '+eur(sum)+(km?' · '+km.toLocaleString('de-DE')+' km':'')+'</span></div>';
        g.forEach(a=>{h+=zeile(a,true)});
      });
  }
  h+='<div class="note">Das ist das Scheckheft: beim Verkauf belegt diese Liste, was am Fahrzeug gemacht wurde — '+
     'und für dich steht hier, wann du welches Teil zuletzt verbaut hast.</div>';
  return h;
}

/* ---------- Preisbuch ---------- */
function renderPreisbuch(){
  let h='<div class="sec"><div class="sechead"><h2>Eigene Positionen</h2>'+
    '<span class="small muted">'+S.preisbuch.length+' angelegt</span></div><div class="card">';
  if(!S.preisbuch.length) h+='<div class="empty">Noch nichts angelegt.</div>';
  S.preisbuch.forEach(p=>{
    const r=satz(p.satzId), tl=p.teile||[];
    const bekannt=tl.filter(t=>Number(t.letzt)>0);
    const teileSum=bekannt.reduce((x,t)=>x+Number(t.letzt)*(Number(t.menge)||1),0);
    h+='<div class="pb"><div><strong>'+esc(p.name)+'</strong>'+
      '<div class="small muted num">'+p.dauer+' min · '+esc(r.name)+' '+eur(r.rate)+'/h · Arbeit '+
      eur((Number(p.dauer)||0)/60*r.rate)+'</div>'+
      (tl.length?'<div class="teileliste">'+tl.map(t=>'<span class="tl">'+esc(t.name)+
        (Number(t.menge)>1?' <span class="muted">×'+t.menge+'</span>':'')+
        (Number(t.letzt)>0
          ?' <span class="num">'+eur(t.letzt)+'</span> <span class="muted">'+esc(kurzDatum(t.datum))+'</span>'
          :' <span class="badge warn">kein Preis</span>')+'</span>').join('')+'</div>':'')+
      '</div>'+
      '<div style="text-align:right">'+
      (bekannt.length?'<div class="small muted">Teile zuletzt</div><div class="num">'+eur(teileSum)+'</div>':'<div class="small muted">nur Arbeit</div>')+
      '<button class="mini ghost" data-a="pb-del" data-id="'+p.id+'" style="margin-top:6px">Löschen</button></div></div>';
  });
  h+='</div><details><summary>Neue Position anlegen</summary><div class="inner">'+
    '<div><label class="lbl" for="p-name">Arbeit</label><input id="p-name" list="dl-arbeit" placeholder="z. B. Bremsbeläge vorne"></div>'+
    '<div class="grid g2" style="margin-top:10px">'+
      '<div><label class="lbl" for="p-dauer">Dauer (min)</label><input id="p-dauer" type="number" inputmode="numeric" min="5" step="5" placeholder="45"></div>'+
      '<div><label class="lbl" for="p-satz">Stundensatz</label><select id="p-satz">'+
        S.settings.saetze.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' · '+eur(s.rate)+'/h</option>').join('')+'</select></div></div>'+
    '<div class="row" style="margin-top:10px"><button class="ghost" data-a="p-schaetz">Dauer schätzen</button>'+
    '<button class="primary" data-a="pb-neu">Anlegen</button></div>'+
    '<div class="hint" id="p-hint">Teile hängst du im Auftrag dran — das Preisbuch merkt sich dann, '+
    'was du zuletzt dafür bezahlt hast.</div></div></details>'+
    '<div class="note">Im Preisbuch steht für Teile <strong>kein fester Preis</strong>, sondern nur der zuletzt bezahlte '+
    'mit Datum. Beim Übernehmen in den Auftrag ist er vorbelegt und in einem Feld änderbar — Teilepreise schwanken '+
    'je nach Händler und Tag.</div></div>';
  return h;
}

/* ---------- Dokument ---------- */
function renderDokument(){
  const a=auftrag();
  if(!a) return '<div class="card"><div class="empty">Erst einen Auftrag anlegen.</div></div>';
  const su=summe(a), st=S.settings, art=S.docArt;
  let h='<div class="seg" style="margin-bottom:14px">'+
    '<button data-a="docart" data-v="kv" aria-pressed="'+(art==='kv')+'">Kostenvoranschlag</button>'+
    '<button data-a="docart" data-v="privat" aria-pressed="'+(art==='privat')+'">Kostenaufstellung</button>'+
    '<button data-a="docart" data-v="rechnung" aria-pressed="'+(art==='rechnung')+'">Rechnung</button></div>';

  const zeile=p=>p.typ==='arbeit'
    ? {t:p.name,d:(Number(p.dauer)||0)+' min × '+eur(satz(p.satzId).rate)+'/h ('+satz(p.satzId).name+')',b:(Number(p.dauer)||0)/60*satz(p.satzId).rate}
    : {t:p.name,d:(Number(p.menge)||1)+' × '+eur(p.preis),b:(Number(p.preis)||0)*(Number(p.menge)||1)};
  const grp=(titel,ps,sum)=>!ps.length?'':'<tr class="grp"><td colspan="2">'+titel+'</td></tr>'+
    ps.map(p=>{const z=zeile(p);return '<tr><td><strong>'+esc(z.t)+'</strong><div class="small muted num">'+esc(z.d)+'</div></td><td class="r">'+eur(z.b)+'</td></tr>'}).join('')+
    '<tr><td class="small muted">Zwischensumme</td><td class="r"><strong>'+eur(sum)+'</strong></td></tr>';
  const tabelle='<div class="tw"><table><thead><tr><th>Position</th><th class="r">Betrag</th></tr></thead><tbody>'+
    grp('Arbeit',a.positionen.filter(p=>p.typ==='arbeit'),su.arbeit)+
    grp('Teile',a.positionen.filter(p=>p.typ==='teil'),su.teile)+'</tbody></table></div>';

  if(art==='kv'){
    const nr=a.kv?a.kv.nr:(st.kvPrefix+String(st.kvNext).padStart(3,'0'));
    const gueltig=plus(a.kv?a.kv.datum:heute(),Number(st.kvGueltig||30));
    const absender=st.mwst==='privat'?(st.privatName||'—'):(st.betrieb.name||'[Betrieb]');
    h+='<div class="doc"><div class="dh"><div><h2>Kostenvoranschlag</h2>'+
      '<div class="small muted num">Nr. '+esc(nr)+' · gültig bis '+esc(kurzDatum(gueltig))+esc(D(gueltig).getFullYear())+'</div></div>'+
      '<div class="small num" style="text-align:right">'+esc(tagLang(heute()))+'<br><span class="muted">'+esc(absender)+'</span></div></div>'+
      '<div class="small" style="margin-bottom:14px"><strong>Für:</strong> '+esc(a.kunde||'—')+
      ' · <strong>Fahrzeug:</strong> '+esc(fzText(a.fahrzeug))+
      (a.fahrzeug.kennzeichen?' · '+esc(a.fahrzeug.kennzeichen):'')+
      (a.fahrzeug.km?' · '+esc(a.fahrzeug.km)+' km':'')+'</div>'+
      tabelle+'<div class="gesamt" style="border:0;padding:0;margin-top:12px">'+
      '<div class="r"><span class="muted">Geschätzte Arbeitszeit</span><span class="num">'+std(su.minuten)+'</span></div>'+
      (st.mwst==='gewerblich'
        ?'<div class="r"><span class="muted">Netto</span><span>'+eur(su.netto)+'</span></div>'+
         '<div class="r"><span class="muted">zzgl. 19 % USt</span><span>'+eur(su.mwst)+'</span></div>':'')+
      '<div class="r t"><span>Voraussichtlich</span><span>'+eur(su.brutto)+'</span></div></div>'+
      (a.kv&&a.kv.angenommen
        ?'<div class="note"><strong>Angenommen am '+esc(kurzDatum(a.kv.angenommen))+esc(D(a.kv.angenommen).getFullYear())+
          '.</strong> Der Termin steht im Kalender.</div>':'')+
      '<div class="note"><strong>Es wurde noch keine Arbeit ausgeführt.</strong> Dieser Kostenvoranschlag ist '+
      'unverbindlich und beruht auf einer Sichtprüfung. Zeigt sich beim Zerlegen ein weiterer Mangel, melde ich '+
      'mich vor der Arbeit. Überschreitungen bis 15 % sind ohne neue Zusage möglich, darüber hinaus nur nach '+
      'Rücksprache.</div></div>'+
      (su.offen?'<div class="note">'+su.offen+' Teil'+(su.offen>1?'e haben':' hat')+' noch keinen Preis — '+
        'im Kostenvoranschlag fehlt der Betrag dann. Preis im Auftrag nachtragen.</div>':'');
  } else if(art==='privat'){
    h+='<div class="doc"><div class="dh"><div><h2>Kostenaufstellung</h2>'+
      '<div class="small muted">Keine Rechnung — Aufstellung über eine privat erbrachte Hilfeleistung</div></div>'+
      '<div class="small num" style="text-align:right">'+esc(tagLang(a.datum))+'<br><span class="muted">'+esc(st.privatName||'—')+'</span></div></div>'+
      '<div class="small" style="margin-bottom:14px"><strong>Für:</strong> '+esc(a.kunde||'—')+' · <strong>Fahrzeug:</strong> '+esc(fzText(a.fahrzeug))+
      (a.fahrzeug.kennzeichen?' · '+esc(a.fahrzeug.kennzeichen):'')+(a.fahrzeug.km?' · '+esc(a.fahrzeug.km)+' km':'')+'</div>'+
      tabelle+'<div class="gesamt" style="border:0;padding:0;margin-top:12px">'+
      '<div class="r"><span class="muted">Arbeitszeit</span><span class="num">'+std(su.minuten)+'</span></div>'+
      '<div class="r t"><span>Gesamt</span><span>'+eur(su.netto)+'</span></div></div>'+
      (zahlung(a).status==='bezahlt'
        ?'<div class="small" style="margin-top:12px"><strong>Betrag '+
          (zahlung(a).art==='bar'?'dankend bar':esc(zahlName(zahlung(a).art).toLowerCase())+' ')+
          ' erhalten am '+esc(kurzDatum(zahlung(a).datum))+esc(D(zahlung(a).datum).getFullYear())+'.</strong></div>':'')+
      '<div class="note"><strong>Private Hilfeleistung, keine gewerbliche Leistung.</strong> '+
      'Diese Aufstellung weist keine Umsatzsteuer aus und ist keine Rechnung im Sinne des § 14 UStG.</div>'+
      (st.haftungPrivat?'<div class="note"><strong>Gewährleistung.</strong> '+esc(HAFTUNGSTEXT)+'</div>':'')+
      '</div>'+
      '<div class="note">Warum ohne Umsatzsteuer: wer als Privatperson USt auf ein Papier schreibt, schuldet sie dem Finanzamt (§ 14c UStG) — '+
      'auch wenn es nur für die Familie war. Darum hat diese Sorte das Feld gar nicht.</div>';
  } else {
    const miss=[];
    if(!st.betrieb.name) miss.push('Name des Betriebs');
    if(!st.betrieb.strasse||!st.betrieb.ort) miss.push('Vollständige Anschrift');
    if(!st.betrieb.steuernr) miss.push('Steuernummer oder USt-IdNr.');
    if(!a.kunde) miss.push('Name des Empfängers');
    if(!(a.kundeAdr||'').trim()) miss.push('Anschrift des Empfängers');
    const nr=a.rechnung?a.rechnung.nr:(st.rnrPrefix+String(st.rnrNext).padStart(3,'0'));
    h+='<div class="doc"><div class="dh"><div><h2>Rechnung</h2><div class="small muted num">Nr. '+esc(nr)+'</div></div>'+
      '<div class="small" style="text-align:right">'+esc(st.betrieb.name||'[Betrieb]')+'<br><span class="muted">'+
      esc(st.betrieb.strasse||'[Straße]')+'<br>'+esc(st.betrieb.ort||'[PLZ, Ort]')+'<br>St.-Nr. '+esc(st.betrieb.steuernr||'[fehlt]')+
      '</span></div></div>'+
      ((a.kv&&a.kv.angenommen)?'<div class="small muted" style="margin-bottom:8px">Grundlage: Kostenvoranschlag '+
        esc(a.kv.nr)+' vom '+esc(kurzDatum(a.kv.datum))+esc(D(a.kv.datum).getFullYear())+
        ', angenommen am '+esc(kurzDatum(a.kv.angenommen))+esc(D(a.kv.angenommen).getFullYear())+'</div>':'')+
      '<div class="small" style="margin-bottom:14px"><strong>Empfänger:</strong> '+esc(a.kunde||'[fehlt]')+
      ((a.kundeAdr||'').trim()?'<br>'+esc(a.kundeAdr).replace(/\n/g,'<br>'):'<br><span style="color:var(--warn)">[Anschrift fehlt]</span>')+
      '<br><strong>Leistungsdatum:</strong> '+esc(tagLang(a.datum))+
      '<br><strong>Fahrzeug:</strong> '+esc(fzText(a.fahrzeug))+(a.fahrzeug.kennzeichen?' · '+esc(a.fahrzeug.kennzeichen):'')+'</div>'+
      tabelle+'<div class="gesamt" style="border:0;padding:0;margin-top:12px">'+
      (st.mwst==='gewerblich'
        ?'<div class="r"><span class="muted">Netto</span><span>'+eur(su.netto)+'</span></div><div class="r"><span class="muted">19 % USt</span><span>'+eur(su.mwst)+'</span></div>'
        :'<div class="r"><span class="muted">Summe</span><span>'+eur(su.netto)+'</span></div>')+
      '<div class="r t"><span>Zu zahlen</span><span>'+eur(su.brutto)+'</span></div></div>'+
      '<div class="small" style="margin-top:12px">'+(zahlung(a).status==='bezahlt'
        ? '<strong>Betrag '+(zahlung(a).art==='bar'?'dankend bar':esc(zahlName(zahlung(a).art).toLowerCase()))+
          ' erhalten am '+esc(kurzDatum(zahlung(a).datum))+esc(D(zahlung(a).datum).getFullYear())+'.</strong> Diese Rechnung gilt als Quittung.'
        : (zahlung(a).art==='bar'?'Zahlbar bar bei Übergabe des Fahrzeugs.'
          :zahlung(a).art==='ec'?'Zahlbar per EC-Karte bei Übergabe des Fahrzeugs.'
          :'Zahlbar per Überweisung.'))+'</div>'+
      (st.mwst==='klein'?'<div class="note">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>':'')+
      (st.mwst==='privat'?'<div class="note"><strong>Achtung:</strong> In den Einstellungen steht „Privat". Für eine echte Rechnung dort auf Kleinunternehmer oder gewerblich umstellen.</div>':'')+
      '</div><div class="sec" style="margin-top:14px"><div class="sechead"><h2>Pflichtangaben § 14 UStG</h2></div><div class="card"><ul class="check">'+
      ['Name des Betriebs','Vollständige Anschrift','Steuernummer oder USt-IdNr.','Name des Empfängers','Anschrift des Empfängers']
        .map(x=>'<li class="'+(miss.includes(x)?'miss':'')+'">'+esc(x)+'</li>').join('')+
      '<li>Rechnungsnummer, fortlaufend</li><li>Leistungsdatum</li><li>Art und Umfang der Leistung</li>'+
      (st.mwst==='gewerblich'?'<li>Steuersatz und Steuerbetrag</li>':'<li>Hinweis auf § 19 UStG</li>')+'</ul>'+
      (miss.length?'<div class="hint">Fehlendes in den Einstellungen nachtragen.</div>':'<div class="hint">Vollständig.</div>')+'</div></div>';
  }
  if(art==='kv') h+='<div class="row" style="margin-top:14px">'+
    (a.kv&&a.kv.angenommen
      ?'<button class="ghost" data-a="kv-zurueck">Annahme zurücknehmen</button>'+
       '<span class="small muted">Termin und Auftrag bleiben bestehen.</span>'
      :'<button class="primary" data-a="kv-an">Angenommen — Termin anlegen</button>'+
       '<span class="small muted">Legt den Termin auf den nächsten freien Platz und merkt sich die Summe.</span>')+
    '</div>';
  h+='<div class="row" style="margin-top:14px"><button class="'+(art==='kv'&&a.kv&&a.kv.angenommen?'ghost':'primary')+'" data-a="pdf">'+
     (art==='kv'?'Kostenvoranschlag als PDF':art==='privat'?'Kostenaufstellung als PDF':'Rechnung als PDF')+'</button>'+
     '<button class="ghost" data-a="copy">Als Text kopieren</button>'+
     '<span class="small muted" id="copy-hint"></span></div>'+
     '<div class="hint" id="pdf-hint">DIN-A4, Anschriftenfeld nach DIN 5008'+
     (art==='kv'?'. Unverbindlich, mit Gültigkeitsdatum — keine Rechnung.'
      :art==='privat'?'. Ohne Steuernummer und ohne Umsatzsteuer.'
      :', mit allen Pflichtangaben nach § 14 UStG.')+'</div>';
  return h;
}

/* ---------- PDF ---------- */
const zahl=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy=d=>{const x=D(d);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear()};

function pdfErzeugen(){
  const a=auftrag(); if(!a) return;
  const st=S.settings, su=summe(a), art=S.docArt, rech=art==='rechnung', kv=art==='kv';
  const sag=t=>{const el=document.getElementById('pdf-hint');if(el)el.innerHTML=t};

  if(rech){
    const fehlt=[];
    if(!st.betrieb.name) fehlt.push('Betrieb');
    if(!st.betrieb.strasse||!st.betrieb.ort) fehlt.push('Anschrift');
    if(!st.betrieb.steuernr) fehlt.push('Steuernummer');
    if(!a.kunde) fehlt.push('Empfänger');
    if(!(a.kundeAdr||'').trim()) fehlt.push('Anschrift des Empfängers');
    if(fehlt.length){
      sag('<span style="color:var(--warn)">Noch keine gültige Rechnung: '+fehlt.join(', ')+
        ' fehlt. In den Einstellungen nachtragen — ohne diese Angaben darf keine Rechnung raus.</span>');
      return;
    }
  }
  const lib=window.jspdf&&window.jspdf.jsPDF;
  if(!lib){sag('<span style="color:var(--warn)">PDF-Bibliothek nicht geladen.</span>');return}

  if(rech&&!a.rechnung){
    a.rechnung={nr:st.rnrPrefix+String(st.rnrNext).padStart(3,'0'),datum:heute()};
    st.rnrNext=Number(st.rnrNext||1)+1; save();
  }
  if(kv&&!a.kv){
    a.kv={nr:st.kvPrefix+String(st.kvNext).padStart(3,'0'),datum:heute()};
    st.kvNext=Number(st.kvNext||1)+1; save();
  }

  const d=new lib({unit:'mm',format:'a4'});
  const M=20, R=190, grau=[110,110,110], hell=[190,190,190];
  const absender=rech
    ? [st.betrieb.name,st.betrieb.strasse,st.betrieb.ort].filter(Boolean).join(' · ')
    : (st.privatName||'');
  const fusszeilen=[];
  let seite=1;

  function fuss(){
    d.setFontSize(7.5); d.setTextColor.apply(d,grau);
    d.setDrawColor.apply(d,hell); d.line(M,277,R,277);
    fusszeilen.forEach((z,i)=>d.text(z,M,281.5+i*3.5));
    d.text('Seite '+seite,R,281.5,{align:'right'});
    d.setTextColor(0);
  }
  function kopfTabelle(y){
    d.setFontSize(8); d.setTextColor.apply(d,grau); d.setFont('helvetica','bold');
    d.text('BEZEICHNUNG',M,y); d.text('MENGE',126,y,{align:'right'});
    d.text('EINZEL',156,y,{align:'right'}); d.text('BETRAG',R,y,{align:'right'});
    d.setDrawColor(60); d.line(M,y+1.5,R,y+1.5);
    d.setFont('helvetica','normal'); d.setTextColor(0); d.setFontSize(9.5);
    return y+7;
  }
  function umbruch(y,braucht){
    if(y+braucht<=268) return y;
    fuss(); d.addPage(); seite++;
    return kopfTabelle(25);
  }

  /* Kopf */
  d.setFontSize(9.5);
  if(rech){
    d.setFont('helvetica','bold'); d.text(st.betrieb.name,R,25,{align:'right'});
    d.setFont('helvetica','normal'); d.setFontSize(8.5); d.setTextColor.apply(d,grau);
    [st.betrieb.strasse,st.betrieb.ort,st.betrieb.tel?'Tel. '+st.betrieb.tel:'',
     'St.-Nr. '+st.betrieb.steuernr].filter(Boolean)
      .forEach((z,i)=>d.text(z,R,30+i*4,{align:'right'}));
  } else {
    d.setFont('helvetica','bold'); d.text(st.privatName||'',R,25,{align:'right'});
  }
  d.setTextColor(0); d.setFont('helvetica','normal');

  /* Anschriftenfeld nach DIN 5008 */
  if(absender){
    d.setFontSize(7); d.setTextColor.apply(d,grau);
    d.text(absender,M,42);
    d.setDrawColor.apply(d,hell); d.line(M,43,M+80,43);
    d.setTextColor(0);
  }
  d.setFontSize(11);
  d.text(a.kunde||'',M,50);
  const adr=(a.kundeAdr||'').split(/[\n,]+/).map(z=>z.trim()).filter(Boolean);
  d.setFontSize(10.5);
  adr.slice(0,4).forEach((z,i)=>d.text(z,M,55.5+i*5));

  /* Titel und Eckdaten */
  d.setFont('helvetica','bold'); d.setFontSize(17);
  d.text(rech?'Rechnung':kv?'Kostenvoranschlag':'Kostenaufstellung',M,78);
  d.setFont('helvetica','normal'); d.setFontSize(9.5);

  const eck=[];
  if(rech) eck.push(['Rechnungsnummer',a.rechnung.nr]);
  if(kv) eck.push(['Nummer',a.kv.nr]);
  eck.push([rech?'Rechnungsdatum':'Datum',dmy(rech?a.rechnung.datum:kv?a.kv.datum:a.datum)]);
  if(kv) eck.push(['Gültig bis',dmy(plus(a.kv.datum,Number(st.kvGueltig||30)))]);
  else eck.push(['Leistungsdatum',dmy(a.datum)]);
  eck.push(['Fahrzeug',fzText(a.fahrzeug)]);
  if(a.fahrzeug.kennzeichen) eck.push(['Kennzeichen',a.fahrzeug.kennzeichen]);
  if(a.fahrzeug.km) eck.push(['Kilometerstand',Number(a.fahrzeug.km).toLocaleString('de-DE')+' km']);
  if(!kv&&a.kv&&a.kv.angenommen) eck.push(['Kostenvoranschlag',a.kv.nr+' vom '+dmy(a.kv.datum)]);
  eck.forEach((z,i)=>{
    d.setTextColor.apply(d,grau); d.text(z[0],M,88+i*5);
    d.setTextColor(0); d.text(String(z[1]),M+42,88+i*5);
  });

  /* Tabelle */
  let y=kopfTabelle(92+eck.length*5);
  const gruppe=(titel,ps)=>{
    if(!ps.length) return;
    y=umbruch(y,12);
    d.setFont('helvetica','bold'); d.setFontSize(8); d.setTextColor.apply(d,grau);
    d.text(titel.toUpperCase(),M,y);
    d.setFont('helvetica','normal'); d.setTextColor(0); d.setFontSize(9.5);
    y+=5;
    ps.forEach(pz=>{
      const arbeit=pz.typ==='arbeit', r=arbeit?satz(pz.satzId):null;
      const menge=arbeit?(Number(pz.dauer)||0)+' min':(Number(pz.menge)||1)+' Stk';
      const einzel=arbeit?zahl(r.rate)+' €/h':zahl(pz.preis)+' €';
      const betrag=arbeit?(Number(pz.dauer)||0)/60*r.rate:(Number(pz.preis)||0)*(Number(pz.menge)||1);
      const txt=d.splitTextToSize(pz.name,78);
      y=umbruch(y,txt.length*4.6+3);
      d.text(txt,M,y);
      d.text(menge,126,y,{align:'right'});
      d.text(einzel,156,y,{align:'right'});
      d.text(zahl(betrag)+' €',R,y,{align:'right'});
      if(arbeit&&r){d.setFontSize(7.5);d.setTextColor.apply(d,grau);
        d.text(r.name,M,y+3.4);d.setFontSize(9.5);d.setTextColor(0);y+=3}
      y+=txt.length*4.6+2.6;
      d.setDrawColor(226); d.line(M,y-1.8,R,y-1.8);
    });
  };
  gruppe('Arbeit',a.positionen.filter(x=>x.typ==='arbeit'));
  gruppe('Teile',a.positionen.filter(x=>x.typ==='teil'));

  /* Summen */
  y=umbruch(y,34)+4;
  const zeileS=(l,v,fett)=>{
    d.setFont('helvetica',fett?'bold':'normal');
    d.setFontSize(fett?11:9.5);
    d.text(l,140,y,{align:'right'}); d.text(v,R,y,{align:'right'});
    d.setFont('helvetica','normal'); d.setFontSize(9.5);
    y+=fett?6:5;
  };
  zeileS((kv?'Arbeit geschätzt (':'Arbeit (')+std(su.minuten).replace(' h',' Std.')+')',zahl(su.arbeit)+' €');
  zeileS('Teile',zahl(su.teile)+' €');
  d.setDrawColor(60); d.line(120,y-3,R,y-3); y+=1.5;
  if(rech&&st.mwst==='gewerblich'){
    zeileS('Nettobetrag',zahl(su.netto)+' €');
    zeileS('zzgl. 19 % USt',zahl(su.mwst)+' €');
    d.setDrawColor(60); d.line(120,y-3,R,y-3); y+=1.5;
    zeileS(kv?'Voraussichtlich':'Gesamtbetrag',zahl(su.brutto)+' €',true);
  } else {
    zeileS(rech?'Gesamtbetrag':kv?'Voraussichtlich':'Gesamt',zahl(su.brutto)+' €',true);
  }

  /* Hinweise */
  y+=6; d.setFontSize(9);
  const hinweise=[];
  if(kv){
    hinweise.push('Es wurde noch keine Arbeit ausgeführt.');
    hinweise.push('Dieser Kostenvoranschlag ist unverbindlich und beruht auf einer Sichtprüfung. Zeigt sich beim '+
      'Zerlegen ein weiterer Mangel, melde ich mich vor der Arbeit. Überschreitungen bis 15 % sind ohne neue '+
      'Zusage möglich, darüber hinaus nur nach Rücksprache.');
    hinweise.push('Gültig bis '+dmy(plus(a.kv.datum,Number(st.kvGueltig||30)))+'.');
  } else if(rech){
    if(st.mwst==='klein') hinweise.push('Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.');
    const z=zahlung(a), tage=Number(st.zahlungsziel||0);
    if(z.status==='bezahlt'){
      hinweise.push('Betrag '+(z.art==='bar'?'dankend bar':z.art==='ec'?'per EC-Karte':'per Überweisung')+
        ' erhalten am '+dmy(z.datum)+'. Diese Rechnung gilt zugleich als Quittung.');
    } else if(z.art==='bar'){
      hinweise.push('Zahlbar bar bei Übergabe des Fahrzeugs.');
    } else if(z.art==='ec'){
      hinweise.push('Zahlbar per EC-Karte bei Übergabe des Fahrzeugs.');
    } else {
      hinweise.push(tage>0
        ? 'Zahlbar ohne Abzug bis zum '+dmy(plus(a.rechnung.datum,tage))+' ('+tage+' Tage).'
        : 'Zahlbar sofort nach Erhalt ohne Abzug.');
      if(st.betrieb.iban) hinweise.push('Bitte überweisen Sie auf '+st.betrieb.iban+
        (st.betrieb.bank?' ('+st.betrieb.bank+')':'')+' unter Angabe der Rechnungsnummer.');
    }
    hinweise.push('Vielen Dank für Ihren Auftrag.');
  } else {
    const z=zahlung(a);
    if(z.status==='bezahlt') hinweise.push('Betrag '+(z.art==='bar'?'bar':z.art==='ec'?'per EC-Karte':'per Überweisung')+
      ' erhalten am '+dmy(z.datum)+'.');
    hinweise.push('Private Hilfeleistung, keine gewerbliche Leistung.');
    if(st.haftungPrivat) hinweise.push(HAFTUNGSTEXT);
    hinweise.push('Diese Aufstellung weist keine Umsatzsteuer aus und ist keine Rechnung im Sinne des § 14 UStG.');
  }
  hinweise.forEach(t=>{
    const zl=d.splitTextToSize(t,R-M);
    y=umbruch(y,zl.length*4.6+2);
    d.text(zl,M,y); y+=zl.length*4.6+1.5;
  });

  if(rech){
    fusszeilen.push([st.betrieb.name,st.betrieb.strasse,st.betrieb.ort].filter(Boolean).join(', '));
    fusszeilen.push(['St.-Nr. '+st.betrieb.steuernr,st.betrieb.tel?'Tel. '+st.betrieb.tel:'',
      st.betrieb.iban?'IBAN '+st.betrieb.iban:''].filter(Boolean).join('  ·  '));
  } else if(st.privatName) fusszeilen.push(st.privatName);
  fuss();

  const name=(rech?'Rechnung_'+a.rechnung.nr:kv?'Kostenvoranschlag_'+a.kv.nr:'Kostenaufstellung_'+a.datum)
    .replace(/[^A-Za-z0-9_.-]/g,'_')+'.pdf';
  try{ d.save(name); }catch(e){}
  render();
  sag('<strong>'+esc(name)+'</strong> erzeugt'+(rech?', Rechnungsnummer '+esc(a.rechnung.nr)+' vergeben':
    kv?', Nummer '+esc(a.kv.nr)+' vergeben':'')+
    '. Lädt der Download hier nicht, liegt das an der Vorschau — als eigene Seite gespeichert läuft er normal.');
}

/* ---------- Zeichnen ---------- */
function render(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.v===S.view)));
  const hd=document.getElementById('today');
  if(hd){const d=D(heute());hd.textContent=WTK[(d.getDay()+6)%7]+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
  const dt=document.getElementById('dl-teile');
  if(dt) dt.innerHTML=[...new Set(S.preisbuch.flatMap(p=>(p.teile||[]).map(t=>t.name)))]
    .map(n=>'<option value="'+esc(n)+'">').join('');
  document.getElementById('dl-arbeit').innerHTML=
    [...new Set([...S.preisbuch.map(p=>p.name),...JOBS.map(j=>j.n)])].map(n=>'<option value="'+esc(n)+'">').join('');
  document.getElementById('main').innerHTML =
      S.view==='kalender'?renderKalender()
    : S.view==='auftrag'?renderAuftrag()
    : S.view==='verlauf'?renderVerlauf()
    : S.view==='preisbuch'?renderPreisbuch()
    : S.view==='dokument'?renderDokument()
    : renderEinstellungen();
  if(S.view==='verlauf'&&S.sucheAktiv){
    const el=document.getElementById('v-suche');
    if(el){el.focus();const v=el.value;el.setSelectionRange(v.length,v.length)}
  }
  save();
}
setInterval(()=>{
  const a=auftrag(); if(!a) return;
  a.positionen.forEach(p=>{
    if(p.typ==='arbeit'&&p.start){
      const el=document.querySelector('[data-live="'+p.id+'"]');
      if(el){const s=Math.floor((Date.now()-p.start)/1000);
        el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+' läuft'}
    }
  });
},1000);

/* ---------- Eingaben ---------- */
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const hint=(id,t)=>{const el=document.getElementById(id);if(el)el.innerHTML=t};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const act=b.dataset.a, id=b.dataset.id, a=auftrag();

  if(act==='tab'){S.view=b.dataset.v;render();return}
  if(act==='docart'){S.docArt=b.dataset.v;render();return}
  if(act==='addmode'){S.addMode=b.dataset.v;render();return}
  if(act==='zahlart'&&a){a.zahlung=zahlung(a);a.zahlung.art=b.dataset.v;render();return}
  if(act==='bezahlt'&&a){a.zahlung=zahlung(a);a.zahlung.status='bezahlt';a.zahlung.datum=heute();render();return}
  if(act==='offen'&&a){a.zahlung=zahlung(a);a.zahlung.status='offen';a.zahlung.datum=null;render();return}
  if(act==='vmodus'){S.vModus=b.dataset.v;S.sucheAktiv=false;render();return}
  if(act==='v-open'){S.aktiv=id;S.view='auftrag';S.sucheAktiv=false;render();return}
  if(act==='calmode'){S.calMode=b.dataset.v;S.monat=S.tag.slice(0,7);render();return}
  if(act==='cal-heute'){S.tag=heute();S.woche=montag(heute());S.monat=heute().slice(0,7);render();return}
  if(act==='cal-prev'||act==='cal-next'){
    const d=act==='cal-next'?1:-1;
    if(S.calMode==='woche') S.woche=plus(S.woche,7*d);
    else{const [y,m]=S.monat.split('-').map(Number);const nd=new Date(y,m-1+d,1);
      S.monat=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')}
    render();return;
  }
  if(act==='cal-tag'){S.tag=b.dataset.d;S.woche=montag(S.tag);S.monat=S.tag.slice(0,7);render();return}

  if(act==='t-schaetz'){
    const s=schaetze(val('t-arbeit'),klasseVon(val('t-fahrzeug')));
    if(!s){hint('t-hint','Für „'+esc(val('t-arbeit'))+'" habe ich keinen Erfahrungswert. Dauer selbst eintragen.');return}
    const d=document.getElementById('t-dauer'); if(d) d.value=s.min;
    hint('t-hint','<strong>'+esc(s.job.n)+'</strong> bei '+esc(s.klasse.n)+': rund <strong class="num">'+s.min+' min</strong> (typisch '+s.von+'–'+s.bis+' min). Schätzung — bitte prüfen.');
    return;
  }
  if(act==='t-add'){
    const datum=val('t-datum')||S.tag;
    S.termine.push({id:uid(),datum,zeit:val('t-zeit')||'09:00',kunde:val('t-kunde'),fahrzeug:val('t-fahrzeug'),
      arbeit:val('t-arbeit'),dauer:Number(val('t-dauer'))||60,status:'offen',auftragId:null});
    S.tag=datum; S.woche=montag(datum); S.monat=datum.slice(0,7); render(); return;
  }
  if(act==='t-del'){S.termine=S.termine.filter(t=>t.id!==id);render();return}
  if(act==='t-done'){const t=S.termine.find(x=>x.id===id);if(t)t.status=t.status==='erledigt'?'offen':'erledigt';render();return}
  if(act==='t-auftrag'){
    const t=S.termine.find(x=>x.id===id); if(!t) return;
    if(!t.auftragId){
      const pb=S.preisbuch.find(p=>norm(p.name)===norm(t.arbeit));
      const teile=(pb?pb.teile:[]).map(x=>({id:uid(),typ:'teil',name:x.name,preis:x.preis,menge:x.menge}));
      const txt=t.fahrzeug||'', teil=txt.split(/[, ]+/);
      const na={id:uid(),kunde:t.kunde,kundeAdr:'',datum:t.datum,zahlung:{art:'bar',status:'offen',datum:null},
        fahrzeug:{hersteller:teil[0]||'',modell:teil.slice(1).filter(x=>!/^\d{4}$/.test(x)).join(' '),
          jahr:(txt.match(/\b(19|20)\d{2}\b/)||[''])[0],klasse:klasseVon(txt),kennzeichen:'',km:''},
        positionen:[{id:uid(),typ:'arbeit',name:t.arbeit||'Arbeit',dauer:Number(t.dauer)||60,
          satzId:(pb?pb.satzId:S.settings.saetze[0].id),ist:null,start:null},...teile]};
      S.auftraege.push(na); t.auftragId=na.id;
    }
    S.aktiv=t.auftragId; S.view='auftrag'; render(); return;
  }

  if(act==='a-neu'){
    const na={id:uid(),kunde:'',kundeAdr:'',datum:S.tag||heute(),zahlung:{art:'bar',status:'offen',datum:null},
      fahrzeug:{hersteller:'',modell:'',jahr:'',klasse:'kompakt',kennzeichen:'',km:''},positionen:[]};
    S.auftraege.push(na); S.aktiv=na.id; S.view='auftrag'; render(); return;
  }
  if(act==='pb-add'&&a){
    const p=S.preisbuch.find(x=>x.id===id); if(!p) return;
    a.positionen.push({id:uid(),typ:'arbeit',name:p.name,dauer:p.dauer,satzId:p.satzId,ist:null,start:null});
    (p.teile||[]).forEach(t=>a.positionen.push({id:uid(),typ:'teil',name:t.name,
      preis:Number(t.letzt)>0?Number(t.letzt):0, ek:null, menge:t.menge||1,
      hinweis:Number(t.letzt)>0?('zuletzt '+kurzDatum(t.datum)):''}));
    render();return;
  }
  if(act==='schaetz'&&a){
    const s=schaetze(val('n-arbeit'),a.fahrzeug.klasse);
    if(!s){hint('s-hint','Für „'+esc(val('n-arbeit'))+'" habe ich keinen Erfahrungswert. Dauer selbst eintragen.');return}
    const d=document.getElementById('n-dauer'); if(d) d.value=s.min;
    hint('s-hint','<strong>'+esc(s.job.n)+'</strong> bei '+esc(s.klasse.n)+' (×'+String(s.klasse.f).replace('.',',')+'): rund <strong class="num">'+s.min+' min</strong>, typisch '+s.von+'–'+s.bis+' min. Schätzung — bitte prüfen.');
    return;
  }
  if(act==='arbeit-add'&&a){
    const n=val('n-arbeit'); if(!n){hint('s-hint','Erst eine Arbeit eintragen.');return}
    a.positionen.push({id:uid(),typ:'arbeit',name:n,
      dauer:Number(val('n-dauer'))||(schaetze(n,a.fahrzeug.klasse)||{min:60}).min,
      satzId:val('n-satz')||S.settings.saetze[0].id,ist:null,start:null});
    render();return;
  }
  if(act==='ins-preisbuch'&&a){
    const n=val('n-arbeit'); if(!n){hint('s-hint','Erst eine Arbeit eintragen.');return}
    S.preisbuch.push({id:uid(),name:n,dauer:Number(val('n-dauer'))||60,satzId:val('n-satz')||S.settings.saetze[0].id,teile:[]});
    hint('s-hint','„'+esc(n)+'" ist jetzt im Preisbuch.');save();return;
  }
  if(act==='teil-add'&&a){
    const n=val('n-tname'); if(!n) return;
    const auf=Number(S.settings.aufschlag)||0, eing=Number(val('n-tpreis').replace(',','.'))||0;
    const ek=auf>0&&eing>0?eing:null;
    const preis=auf>0&&eing>0?Math.round(eing*(1+auf/100)*100)/100:eing;
    a.positionen.push({id:uid(),typ:'teil',name:n,preis,ek,menge:Number(val('n-tmenge'))||1,hinweis:''});
    if(preis>0) lernePreis(n,preis);
    render();return;
  }
  if(act==='pos-del'&&a){a.positionen=a.positionen.filter(p=>p.id!==id);render();return}
  if(act==='timer'&&a){
    const p=a.positionen.find(x=>x.id===id); if(!p) return;
    if(p.start){p.ist=Math.max(1,Math.round((Date.now()-p.start)/60000));p.start=null} else p.start=Date.now();
    render();return;
  }
  if(act==='ist-uebernehmen'&&a){
    const p=a.positionen.find(x=>x.id===id); if(!p||p.ist==null) return;
    const pb=S.preisbuch.find(x=>norm(x.name)===norm(p.name));
    if(pb) pb.dauer=Math.round(p.ist); else S.preisbuch.push({id:uid(),name:p.name,dauer:Math.round(p.ist),satzId:p.satzId,teile:[]});
    p.dauer=Math.round(p.ist); render(); return;
  }
  if(act==='pb-neu'){
    const n=val('p-name'); if(!n){hint('p-hint','Erst eine Arbeit eintragen.');return}
    S.preisbuch.push({id:uid(),name:n,dauer:Number(val('p-dauer'))||(schaetze(n,'kompakt')||{min:60}).min,
      satzId:val('p-satz')||S.settings.saetze[0].id,teile:[]});
    render();return;
  }
  if(act==='p-schaetz'){
    const s=schaetze(val('p-name'),'kompakt');
    if(!s){hint('p-hint','Kein Erfahrungswert für „'+esc(val('p-name'))+'".');return}
    const d=document.getElementById('p-dauer'); if(d) d.value=s.min;
    hint('p-hint','<strong>'+esc(s.job.n)+'</strong>, Kompaktklasse: rund <strong class="num">'+s.min+' min</strong>. Im Auftrag wird nach Fahrzeugklasse umgerechnet.');
    return;
  }
  if(act==='pb-del'){S.preisbuch=S.preisbuch.filter(p=>p.id!==id);render();return}
  if(act==='satz-neu'){S.settings.saetze.push({id:uid(),name:'Neuer Satz',rate:60});render();return}
  if(act==='satz-del'){S.settings.saetze=S.settings.saetze.filter(s=>s.id!==id);render();return}
  if(act==='reset'){S=seed();render();return}
  if(act==='leeren'){S.termine=[];S.auftraege=[];S.aktiv=null;render();return}
  if(act==='kv-an'&&a){
    const st=S.settings, su2=summe(a);
    if(!a.kv){a.kv={nr:st.kvPrefix+String(st.kvNext).padStart(3,'0'),datum:heute()};
      st.kvNext=Number(st.kvNext||1)+1}
    a.kv.angenommen=heute(); a.kv.summe=su2.brutto;
    const dauer=Math.max(15,su2.minuten||60);
    const platz=freierPlatz(dauer);
    const arb=a.positionen.filter(x=>x.typ==='arbeit');
    S.termine.push({id:uid(),datum:platz.datum,zeit:platz.zeit,kunde:a.kunde||'Ohne Namen',
      fahrzeug:fzText(a.fahrzeug)+(a.fahrzeug.kennzeichen?', '+a.fahrzeug.kennzeichen:''),
      arbeit:arb.length?arb.map(x=>x.name).join(' · '):'Aus Kostenvoranschlag',
      dauer,status:'offen',auftragId:a.id});
    S.tag=platz.datum; S.woche=montag(platz.datum); S.monat=platz.datum.slice(0,7);
    S.view='kalender'; render(); return;
  }
  if(act==='kv-zurueck'&&a&&a.kv){a.kv.angenommen=null;a.kv.summe=null;render();return}
  if(act==='pdf'){pdfErzeugen();return}
  if(act==='copy'){
    const a2=auftrag(); if(!a2) return;
    const su=summe(a2);
    const kopf=S.docArt==='privat'
      ?'KOSTENAUFSTELLUNG (private Hilfeleistung, keine Umsatzsteuer)'
      :'RECHNUNG '+S.settings.rnrPrefix+String(S.settings.rnrNext).padStart(3,'0');
    const txt=[kopf,'','Datum: '+tagLang(a2.datum),'Kunde: '+(a2.kunde||'—'),
      'Fahrzeug: '+fzText(a2.fahrzeug),'','ARBEIT',
      ...a2.positionen.filter(p=>p.typ==='arbeit').map(p=>'- '+p.name+': '+p.dauer+' min x '+eur(satz(p.satzId).rate)+'/h = '+eur((Number(p.dauer)||0)/60*satz(p.satzId).rate)),
      '','TEILE',
      ...a2.positionen.filter(p=>p.typ==='teil').map(p=>'- '+p.name+': '+(Number(p.menge)||1)+' x '+eur(p.preis)+' = '+eur((Number(p.preis)||0)*(Number(p.menge)||1))),
      '','Arbeit: '+eur(su.arbeit)+' ('+std(su.minuten)+')','Teile: '+eur(su.teile),
      (S.settings.mwst==='gewerblich'?'Netto: '+eur(su.netto)+'\n19 % USt: '+eur(su.mwst):''),
      'Gesamt: '+eur(su.brutto)].filter(x=>x!=='').join('\n');
    const el=document.getElementById('copy-hint');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{if(el)el.textContent='Kopiert.'}).catch(()=>{
        if(el) el.textContent='Kopieren ging nicht — Text unten markieren.';
        const ta=document.createElement('textarea'); ta.value=txt; ta.rows=12; ta.style.marginTop='10px';
        b.parentNode.appendChild(ta); ta.select();
      });
    } else if(el) el.textContent='Kopieren nicht möglich.';
    return;
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='v-suche'){S.suche=e.target.value;S.sucheAktiv=true;render()}
});

document.addEventListener('change',e=>{
  const t=e.target, a=auftrag();
  if(t.dataset.a2==='switch'){S.aktiv=t.value;render();return}
  if(t.dataset.tp&&a){
    const p=a.positionen.find(x=>x.id===t.dataset.id); if(!p) return;
    const v=Number(String(t.value).replace(',','.'));
    if(t.dataset.tp==='menge') p.menge=Math.max(1,Math.round(v)||1);
    else if(t.dataset.tp==='ek'){
      p.ek=v>0?v:null;
      const auf=Number(S.settings.aufschlag)||0;
      if(p.ek&&auf>0){p.preis=Math.round(p.ek*(1+auf/100)*100)/100;p.hinweis=''}
    } else {p.preis=v>0?v:0;p.hinweis=''}
    if(Number(p.preis)>0) lernePreis(p.name,Number(p.preis));
    save(); render(); return;
  }
  if(t.dataset.f&&a){
    const f=t.dataset.f;
    if(f.startsWith('fz.')) a.fahrzeug[f.slice(3)]=t.value; else a[f]=t.value;
    save(); render(); return;
  }
  if(t.dataset.s){
    const s=S.settings.saetze.find(x=>x.id===t.dataset.id);
    if(s) s[t.dataset.s]=t.dataset.s==='rate'?(Number(t.value)||0):t.value;
    save(); render(); return;
  }
  if(t.dataset.o){S.settings.oeffnung[t.dataset.o]=t.value;save();render();return}
  if(t.dataset.b){
    const k=t.dataset.b;
    if(k.startsWith('betrieb.')) S.settings.betrieb[k.slice(8)]=t.value; else S.settings[k]=t.value;
    save(); return;
  }
  if(t.dataset.a==='mwst'){S.settings.mwst=t.value;save();render();return}
  if(t.dataset.a==='haftung'){S.settings.haftungPrivat=t.checked;save();render();return}
});

render();
</script>
