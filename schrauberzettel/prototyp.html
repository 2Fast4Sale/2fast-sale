<title>Schrauberzettel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte wie ein Auftragsblock — Kopfleiste mit Reitern, darunter Karten, Summe am Fuss */
:root{
  --bg:#f4f3f0; --surface:#ffffff; --surface-2:#ebe8e3; --surface-3:#e1ddd6;
  --fg:#1a1917; --muted:#6b6761; --line:#dcd8d1;
  --accent:#a85a06; --accent-fg:#ffffff; --ok:#2f6f3a; --warn:#a33c16;
  --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1d1c19; --surface-2:#262420; --surface-3:#302d27;
  --fg:#f0eeea; --muted:#9d978d; --line:#332f29;
  --accent:#e3993f; --accent-fg:#1a1917; --ok:#6cc47e; --warn:#e08a63;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1c19; --surface-2:#262420; --surface-3:#302d27;
  --fg:#f0eeea; --muted:#9d978d; --line:#332f29;
  --accent:#e3993f; --accent-fg:#1a1917; --ok:#6cc47e; --warn:#e08a63;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-b);
  font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.proto{font-family:var(--font-d);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:1px solid transparent;color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.lbl{display:block;font-family:var(--font-d);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{font-family:var(--font-b);font-size:15px;color:var(--fg);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}.g3.keep{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:var(--font-d);font-weight:600;font-size:13px;cursor:pointer;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:9px 13px}
button:hover{background:var(--surface-3)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.primary:hover{filter:brightness(1.08);background:var(--accent)}
.ghost{background:none;border-color:var(--line)}
.mini{font-size:11px;padding:5px 9px;letter-spacing:.04em}
.icon{padding:5px 8px;font-size:13px;line-height:1;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-d);font-size:12px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.badge{display:inline-block;font-family:var(--font-d);font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-3);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pos{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos .nm{font-weight:500}
.pos .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pos .sub{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pos .acts{grid-column:2;display:flex;gap:4px;justify-content:flex-end}
.sum{border-top:2px solid var(--fg);margin-top:10px;padding-top:10px;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .total{font-family:var(--font-d);font-size:19px;font-weight:700;padding-top:4px}
.day{margin-bottom:14px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.dayhead h3{font-size:14px;font-weight:600}
.bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--warn)}
.termin{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:11px 12px;margin-bottom:7px}
.termin.done{border-left-color:var(--ok);opacity:.72}
.termin .t1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.termin .zeit{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums}
.pb{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.pb:first-of-type{border-top:0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:14px}
.doc h2{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}
.doc table{width:100%;border-collapse:collapse;font-size:14px}
.doc th{text-align:left;font-family:var(--font-d);font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:0 0 6px}
.doc td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc td.r,.doc th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.tw{overflow-x:auto}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;margin-top:14px}
.check{list-style:none;padding:0;margin:8px 0 0;font-size:13px;display:grid;gap:3px}
.check li::before{content:"✓ ";color:var(--ok);font-weight:700}
.check li.miss::before{content:"✗ ";color:var(--warn)}
.check li.miss{color:var(--warn)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 13px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13.5px}
footer{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <div class="brandrow">
      <h1>Schrauberzettel</h1>
      <span class="proto">Prototyp</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-a="tab" data-v="kalender">Kalender</button>
      <button class="tab" role="tab" data-a="tab" data-v="auftrag">Auftrag</button>
      <button class="tab" role="tab" data-a="tab" data-v="preisbuch">Preisbuch</button>
      <button class="tab" role="tab" data-a="tab" data-v="dokument">Dokument</button>
      <button class="tab" role="tab" data-a="tab" data-v="einstellungen">Einstellungen</button>
    </div>
  </div>
  <main id="main"></main>
  <footer>
    Prototyp zum Durchklicken. Die Dauer-Vorschläge kommen aus einer eingebauten Tabelle mit Erfahrungswerten —
    nicht aus DAT oder Audatex. Alles bleibt in diesem Browser.
  </footer>
</div>

<script>
/* ---------- Dauer-Tabelle: Erfahrungswerte in Minuten ---------- */
const JOBS=[
 {n:'Ölwechsel mit Filter',m:30,k:['öl','olwechsel','ölwechsel','ölservice','inspektion klein']},
 {n:'Bremsbeläge vorne',m:45,k:['bremsbelage vorne','belage vorne','bremsen vorne belage']},
 {n:'Bremsbeläge + Scheiben vorne',m:60,k:['bremsen vorne','scheiben vorne','bremsscheiben vorne']},
 {n:'Bremsbeläge hinten',m:45,k:['bremsbelage hinten','belage hinten']},
 {n:'Bremsbeläge + Scheiben hinten',m:60,k:['bremsen hinten','scheiben hinten','bremsscheiben hinten']},
 {n:'Bremsflüssigkeit wechseln',m:45,k:['bremsflussigkeit','bremsflüssigkeit']},
 {n:'Bremssattel erneuern',m:75,k:['bremssattel','sattel']},
 {n:'Handbremsseil',m:60,k:['handbremse','handbremsseil']},
 {n:'Generator / Lichtmaschine',m:90,k:['generator','lichtmaschine','lima','alternator']},
 {n:'Anlasser / Starter',m:75,k:['anlasser','starter']},
 {n:'Batterie wechseln',m:20,k:['batterie','akku']},
 {n:'Keilrippenriemen',m:60,k:['keilrippenriemen','keilriemen','nebenaggregateriemen']},
 {n:'Zahnriemen mit Wasserpumpe',m:240,k:['zahnriemen','riemenwechsel']},
 {n:'Steuerkette',m:420,k:['steuerkette','kette']},
 {n:'Kupplung',m:300,k:['kupplung','zweimassenschwungrad','zms']},
 {n:'Wasserpumpe',m:150,k:['wasserpumpe']},
 {n:'Thermostat',m:90,k:['thermostat']},
 {n:'Kühler',m:120,k:['kuhler','kühler','wasserkuhler']},
 {n:'Zündkerzen',m:45,k:['zundkerzen','zündkerzen','kerzen']},
 {n:'Glühkerzen',m:90,k:['gluhkerzen','glühkerzen']},
 {n:'Luftfilter',m:15,k:['luftfilter']},
 {n:'Innenraumfilter',m:20,k:['innenraumfilter','pollenfilter']},
 {n:'Kraftstofffilter',m:45,k:['kraftstofffilter','dieselfilter','benzinfilter']},
 {n:'Stoßdämpfer vorne (Paar)',m:120,k:['stossdampfer vorne','stoßdämpfer vorne','dampfer vorne']},
 {n:'Stoßdämpfer hinten (Paar)',m:90,k:['stossdampfer hinten','stoßdämpfer hinten','dampfer hinten']},
 {n:'Federn vorne (Paar)',m:150,k:['federn','fahrwerksfeder']},
 {n:'Querlenker',m:75,k:['querlenker','traggelenk']},
 {n:'Spurstangenkopf',m:45,k:['spurstange','spurstangenkopf']},
 {n:'Radlager vorne',m:90,k:['radlager vorne']},
 {n:'Radlager hinten',m:75,k:['radlager hinten','radlager']},
 {n:'Antriebswelle',m:120,k:['antriebswelle','gelenkwelle']},
 {n:'Achsmanschette',m:90,k:['achsmanschette','manschette']},
 {n:'Auspuff Mittelteil',m:60,k:['auspuff','mittelschalldampfer']},
 {n:'Endschalldämpfer',m:45,k:['endschalldampfer','endtopf']},
 {n:'Turbolader',m:240,k:['turbo','turbolader','lader']},
 {n:'AGR-Ventil',m:120,k:['agr','abgasruckfuhrung']},
 {n:'Dieselpartikelfilter reinigen',m:180,k:['dpf','partikelfilter','russfilter']},
 {n:'Einspritzdüse / Injektor',m:120,k:['injektor','einspritzduse','dusen']},
 {n:'Zylinderkopfdichtung',m:600,k:['zylinderkopfdichtung','zkd','kopfdichtung']},
 {n:'Motorlager',m:90,k:['motorlager']},
 {n:'Lenkgetriebe',m:240,k:['lenkgetriebe','servo']},
 {n:'Klimaservice',m:45,k:['klima','klimaservice','klimaanlage']},
 {n:'ABS-Sensor',m:45,k:['abs','abs-sensor','drehzahlfuhler']},
 {n:'Scheibenwischer',m:10,k:['wischer','scheibenwischer','wischerblatter']},
 {n:'Reifenwechsel (4 Räder)',m:30,k:['reifen','radwechsel','reifenwechsel']},
 {n:'Achsvermessung',m:60,k:['achsvermessung','spur einstellen','vermessung']},
 {n:'HU-Vorbereitung / Durchsicht',m:45,k:['hu','tuv','tüv','durchsicht','vorbereitung']},
 {n:'Fehlerspeicher auslesen',m:20,k:['fehlerspeicher','diagnose','auslesen','obd']}
];
const KLASSEN=[
 {id:'klein',n:'Kleinwagen',f:0.9},
 {id:'kompakt',n:'Kompaktklasse',f:1.0},
 {id:'mittel',n:'Mittelklasse',f:1.1},
 {id:'suv',n:'SUV / Van',f:1.2},
 {id:'premium',n:'Oberklasse / Premium',f:1.3},
 {id:'oldtimer',n:'Oldtimer',f:1.45}
];
const MODELL_HINT=[
 [/up!|fox|aygo|panda|twingo|ka\b|lupo|smart|mii|c1/i,'klein'],
 [/golf|astra|focus|civic|corsa|polo|ibiza|leon|a3|1er|cla|308|megane/i,'kompakt'],
 [/passat|insignia|mondeo|a4|a6|3er|5er|c-klasse|e-klasse|superb|octavia|508|talisman/i,'mittel'],
 [/tiguan|touran|sharan|qashqai|x1|x3|q5|tucson|kuga|zafira|caddy|transporter|sprinter|vito|ducato/i,'suv'],
 [/a8|7er|s-klasse|q7|x5|touareg|phaeton|panamera|range rover/i,'premium'],
 [/kafer|käfer|beetle 19|w11|w12|pagode|bulli|t1\b|t2\b|ente|2cv|oldtimer|mgb|spider/i,'oldtimer']
];
const norm=s=>(s||'').toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/[^a-z0-9 +]/g,' ').replace(/\s+/g,' ').trim();
function findJob(q){
  const n=norm(q); if(n.length<2) return null;
  let best=null,score=0;
  for(const j of JOBS){
    for(const key of [norm(j.n),...j.k.map(norm)]){
      let s=0;
      if(n===key) s=key.length+100;
      else if(n.includes(key)) s=key.length+20;
      else if(key.includes(n)) s=n.length;
      if(s>score){score=s;best=j}
    }
  }
  return score>=3?best:null;
}
function klasseVon(txt){
  for(const [re,id] of MODELL_HINT) if(re.test(txt||'')) return id;
  return 'kompakt';
}
function schaetze(arbeit,klasseId){
  const j=findJob(arbeit); if(!j) return null;
  const k=KLASSEN.find(x=>x.id===klasseId)||KLASSEN[1];
  const m=Math.round(j.m*k.f/5)*5;
  return {job:j,klasse:k,min:m,von:Math.round(m*0.75/5)*5,bis:Math.round(m*1.25/5)*5};
}

/* ---------- Zustand ---------- */
const KEY='schrauberzettel.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.toISOString().slice(0,10);
function tagePlus(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
function seed(){
  const s1=uid(),s2=uid(),a1=uid();
  return {
    settings:{
      betrieb:{name:'',strasse:'',ort:'',tel:'',steuernr:''},
      privatName:'Max Beispiel',
      saetze:[{id:s1,name:'Mechanik',rate:60},{id:s2,name:'Elektrik',rate:75}],
      mwst:'privat', rnrPrefix:'2026-', rnrNext:1,
      oeffnung:{von:'08:00',bis:'17:00'},
      beispiel:true
    },
    preisbuch:[
      {id:uid(),name:'Ölwechsel mit Filter',dauer:30,satzId:s1,teile:[{name:'Motoröl 5W-30, 5 l',preis:38,menge:1},{name:'Ölfilter',preis:9,menge:1}]},
      {id:uid(),name:'Bremsbeläge + Scheiben hinten',dauer:60,satzId:s1,teile:[{name:'Bremsscheiben hinten (Paar)',preis:55,menge:1},{name:'Bremsbeläge hinten',preis:30,menge:1}]},
      {id:uid(),name:'Bremsbeläge + Scheiben vorne',dauer:65,satzId:s1,teile:[{name:'Bremsscheiben vorne (Paar)',preis:72,menge:1},{name:'Bremsbeläge vorne',preis:38,menge:1}]},
      {id:uid(),name:'Generator / Lichtmaschine',dauer:95,satzId:s2,teile:[{name:'Generator (überholt)',preis:210,menge:1}]},
      {id:uid(),name:'Zündkerzen (4 Zylinder)',dauer:40,satzId:s2,teile:[{name:'Zündkerzen, Satz',preis:34,menge:1}]},
      {id:uid(),name:'Innenraumfilter',dauer:20,satzId:s1,teile:[{name:'Innenraumfilter',preis:14,menge:1}]},
      {id:uid(),name:'HU-Vorbereitung / Durchsicht',dauer:45,satzId:s1,teile:[]},
      {id:uid(),name:'Fehlerspeicher auslesen',dauer:20,satzId:s2,teile:[]}
    ],
    termine:[
      {id:uid(),datum:tagePlus(0),zeit:'09:00',kunde:'Schwager (privat)',fahrzeug:'VW Passat B8, 2017',arbeit:'Generator / Lichtmaschine',dauer:95,status:'offen',auftragId:a1},
      {id:uid(),datum:tagePlus(0),zeit:'13:30',kunde:'Frau Özkan',fahrzeug:'Opel Corsa D, 2012',arbeit:'HU-Vorbereitung / Durchsicht',dauer:45,status:'offen',auftragId:null},
      {id:uid(),datum:tagePlus(2),zeit:'08:30',kunde:'Herr Brandt',fahrzeug:'VW Käfer 1303, 1973',arbeit:'Bremsbeläge + Scheiben vorne',dauer:95,status:'offen',auftragId:null},
      {id:uid(),datum:tagePlus(3),zeit:'10:00',kunde:'Kleinmann GmbH',fahrzeug:'Ford Transit, 2019',arbeit:'Ölwechsel mit Filter',dauer:35,status:'offen',auftragId:null}
    ],
    auftraege:[{
      id:a1,kunde:'Schwager (privat)',datum:tagePlus(0),
      fahrzeug:{hersteller:'VW',modell:'Passat B8',jahr:'2017',klasse:'mittel',kennzeichen:'DO-XY 471',km:'142500'},
      positionen:[
        {id:uid(),typ:'arbeit',name:'Generator / Lichtmaschine',dauer:95,satzId:s2,ist:null,start:null},
        {id:uid(),typ:'teil',name:'Generator (überholt)',preis:210,menge:1},
        {id:uid(),typ:'arbeit',name:'Bremsbeläge + Scheiben hinten',dauer:60,satzId:s1,ist:null,start:null},
        {id:uid(),typ:'teil',name:'Bremsscheiben hinten (Paar)',preis:55,menge:1},
        {id:uid(),typ:'teil',name:'Bremsbeläge hinten',preis:30,menge:1}
      ]
    }],
    aktiv:a1, view:'kalender', docArt:'privat'
  };
}
let S;
try{const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):seed()}catch(e){S=seed()}
if(!S||!S.settings) S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Helfer ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const std=m=>((Number(m)||0)/60).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' h';
const satz=id=>S.settings.saetze.find(s=>s.id===id)||S.settings.saetze[0]||{name:'—',rate:0};
const WT=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function datumLang(s){
  const d=new Date(s+'T12:00:00'); const heute=iso(new Date());
  const pre = s===heute?'Heute · ':(s===tagePlus(1)?'Morgen · ':'');
  return pre+WT[d.getDay()]+', '+d.getDate()+'. '+['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()];
}
function auftrag(){return S.auftraege.find(a=>a.id===S.aktiv)||null}
function summe(a){
  let arbeit=0,teile=0;
  (a?a.positionen:[]).forEach(p=>{
    if(p.typ==='arbeit') arbeit+=(Number(p.dauer)||0)/60*satz(p.satzId).rate;
    else teile+=(Number(p.preis)||0)*(Number(p.menge)||1);
  });
  const netto=arbeit+teile;
  const mode=S.settings.mwst;
  const mwst=mode==='gewerblich'?netto*0.19:0;
  return {arbeit,teile,netto,mwst,brutto:netto+mwst,minuten:(a?a.positionen:[]).filter(p=>p.typ==='arbeit').reduce((x,p)=>x+(Number(p.dauer)||0),0)};
}
const kapazitaet=()=>{
  const [h1,m1]=S.settings.oeffnung.von.split(':').map(Number);
  const [h2,m2]=S.settings.oeffnung.bis.split(':').map(Number);
  return Math.max(60,(h2*60+m2)-(h1*60+m1));
};

/* ---------- Ansichten ---------- */
function renderKalender(){
  const tage={};
  S.termine.forEach(t=>{(tage[t.datum]=tage[t.datum]||[]).push(t)});
  const heute=iso(new Date());
  if(!tage[heute]) tage[heute]=[];
  const keys=Object.keys(tage).sort();
  const kap=kapazitaet();
  let h='<div class="card"><h2>Termin eintragen</h2>'+
    '<div class="grid g3 keep">'+
      '<div><label class="lbl" for="t-datum">Datum</label><input id="t-datum" type="date" value="'+heute+'"></div>'+
      '<div><label class="lbl" for="t-zeit">Uhrzeit</label><input id="t-zeit" type="time" value="09:00"></div>'+
      '<div><label class="lbl" for="t-dauer">Dauer (min)</label><input id="t-dauer" type="number" inputmode="numeric" min="5" step="5" value="60"></div>'+
    '</div><div class="grid g2" style="margin-top:10px">'+
      '<div><label class="lbl" for="t-kunde">Kunde</label><input id="t-kunde" placeholder="Name"></div>'+
      '<div><label class="lbl" for="t-fahrzeug">Fahrzeug</label><input id="t-fahrzeug" placeholder="z. B. VW Passat B8, 2017"></div>'+
    '</div><div style="margin-top:10px"><label class="lbl" for="t-arbeit">Arbeit</label>'+
      '<input id="t-arbeit" list="dl-arbeit" placeholder="z. B. Generator"></div>'+
    '<div class="row" style="margin-top:10px"><button class="ghost" data-a="t-schaetz">Dauer schätzen</button>'+
      '<button class="primary" data-a="t-add">Termin anlegen</button></div>'+
    '<div class="hint" id="t-hint">Fahrzeug und Arbeit eintragen, dann schätzen — die Klasse wird aus dem Fahrzeug erkannt.</div></div>';
  h+='<datalist id="dl-arbeit">'+[...new Set([...S.preisbuch.map(p=>p.name),...JOBS.map(j=>j.n)])].map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>';

  keys.forEach(k=>{
    const list=tage[k].slice().sort((a,b)=>a.zeit.localeCompare(b.zeit));
    const belegt=list.filter(t=>t.status!=='erledigt').reduce((x,t)=>x+(Number(t.dauer)||0),0);
    const pct=Math.min(100,Math.round(belegt/kap*100));
    h+='<div class="day"><div class="dayhead"><h3>'+esc(datumLang(k))+'</h3>'+
      '<span class="small muted num">'+std(belegt)+' von '+std(kap)+' · '+pct+'%</span></div>'+
      '<div class="bar"><i class="'+(pct>=100?'full':'')+'" style="width:'+pct+'%"></i></div>';
    if(!list.length) h+='<div class="empty">Kein Termin an diesem Tag.</div>';
    list.forEach(t=>{
      h+='<div class="termin'+(t.status==='erledigt'?' done':'')+'">'+
        '<div class="t1"><span class="zeit">'+esc(t.zeit)+'</span><strong>'+esc(t.kunde||'Ohne Namen')+'</strong>'+
        (t.status==='erledigt'?'<span class="badge ok">erledigt</span>':'<span class="badge num">'+(Number(t.dauer)||0)+' min</span>')+'</div>'+
        '<div class="small muted" style="margin-top:3px">'+esc(t.fahrzeug||'—')+' · '+esc(t.arbeit||'—')+'</div>'+
        '<div class="row" style="margin-top:9px">'+
          '<button class="mini" data-a="t-auftrag" data-id="'+t.id+'">'+(t.auftragId?'Auftrag öffnen':'Auftrag anlegen')+'</button>'+
          '<button class="mini ghost" data-a="t-done" data-id="'+t.id+'">'+(t.status==='erledigt'?'Wieder offen':'Erledigt')+'</button>'+
          '<button class="mini ghost" data-a="t-del" data-id="'+t.id+'">Löschen</button>'+
        '</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="note">Später für die Kundenbuchung: die Tagesleiste zeigt schon, wie voll ein Tag ist. '+
     'Aus "noch frei" wird dann der Slot, den der Kunde selbst wählen kann.</div>';
  return h;
}

function renderDokument(){
  const a=auftrag();
  if(!a) return '<div class="card"><div class="empty">Erst einen Auftrag anlegen.</div></div>';
  const su=summe(a), st=S.settings, art=S.docArt;
  let h='<div class="seg">'+
    '<button data-a="docart" data-v="privat" aria-pressed="'+(art==='privat')+'">Kostenaufstellung</button>'+
    '<button data-a="docart" data-v="rechnung" aria-pressed="'+(art==='rechnung')+'">Rechnung</button></div>';

  const fz=[a.fahrzeug.hersteller,a.fahrzeug.modell,a.fahrzeug.jahr?'('+a.fahrzeug.jahr+')':''].filter(Boolean).join(' ');
  const zeilen=a.positionen.map(p=>{
    if(p.typ==='arbeit'){
      const r=satz(p.satzId);
      return {t:p.name,d:(Number(p.dauer)||0)+' min × '+eur(r.rate)+'/h ('+esc(r.name)+')',b:(Number(p.dauer)||0)/60*r.rate};
    }
    return {t:p.name,d:(Number(p.menge)||1)+' × '+eur(p.preis),b:(Number(p.preis)||0)*(Number(p.menge)||1)};
  });
  const tabelle='<div class="tw"><table><thead><tr><th>Position</th><th class="r">Betrag</th></tr></thead><tbody>'+
    zeilen.map(z=>'<tr><td><strong>'+esc(z.t)+'</strong><div class="small muted num">'+z.d+'</div></td>'+
      '<td class="r">'+eur(z.b)+'</td></tr>').join('')+'</tbody></table></div>';

  if(art==='privat'){
    h+='<div class="doc"><div class="dh"><div><h2>Kostenaufstellung</h2>'+
      '<div class="small muted">Keine Rechnung — Aufstellung über eine privat erbrachte Hilfeleistung</div></div>'+
      '<div class="small num" style="text-align:right">'+esc(datumLang(a.datum))+'<br><span class="muted">'+esc(st.privatName||'—')+'</span></div></div>'+
      '<div class="small" style="margin-bottom:14px"><strong>Für:</strong> '+esc(a.kunde||'—')+' · <strong>Fahrzeug:</strong> '+esc(fz||'—')+
      (a.fahrzeug.kennzeichen?' · '+esc(a.fahrzeug.kennzeichen):'')+(a.fahrzeug.km?' · '+esc(a.fahrzeug.km)+' km':'')+'</div>'+
      tabelle+
      '<div class="sum"><div><span class="muted">Arbeitszeit</span><span class="num">'+std(su.minuten)+'</span></div>'+
      '<div class="total"><span>Gesamt</span><span>'+eur(su.netto)+'</span></div></div>'+
      '<div class="note"><strong>Private Hilfeleistung, keine gewerbliche Leistung.</strong> '+
      'Diese Aufstellung weist keine Umsatzsteuer aus und ist keine Rechnung im Sinne des § 14 UStG.</div></div>'+
      '<div class="note">Warum ohne Umsatzsteuer: wer als Privatperson USt auf ein Papier schreibt, schuldet sie dem Finanzamt (§ 14c UStG) — '+
      'auch wenn es nur für die Familie war. Darum hat diese Sorte das Feld gar nicht.</div>';
  } else {
    const miss=[];
    if(!st.betrieb.name) miss.push('Name des Betriebs');
    if(!st.betrieb.strasse||!st.betrieb.ort) miss.push('Vollständige Anschrift');
    if(!st.betrieb.steuernr) miss.push('Steuernummer oder USt-IdNr.');
    if(!a.kunde) miss.push('Name des Empfängers');
    const nr=st.rnrPrefix+String(st.rnrNext).padStart(3,'0');
    h+='<div class="doc"><div class="dh"><div><h2>Rechnung</h2>'+
      '<div class="small muted num">Nr. '+esc(nr)+'</div></div>'+
      '<div class="small" style="text-align:right">'+esc(st.betrieb.name||'[Betrieb]')+'<br>'+
      '<span class="muted">'+esc(st.betrieb.strasse||'[Straße]')+'<br>'+esc(st.betrieb.ort||'[PLZ, Ort]')+'<br>'+
      'St.-Nr. '+esc(st.betrieb.steuernr||'[fehlt]')+'</span></div></div>'+
      '<div class="small" style="margin-bottom:14px"><strong>Empfänger:</strong> '+esc(a.kunde||'[fehlt]')+
      '<br><strong>Leistungsdatum:</strong> '+esc(datumLang(a.datum))+
      '<br><strong>Fahrzeug:</strong> '+esc(fz||'—')+(a.fahrzeug.kennzeichen?' · '+esc(a.fahrzeug.kennzeichen):'')+'</div>'+
      tabelle+'<div class="sum">'+
      (st.mwst==='gewerblich'
        ?'<div><span class="muted">Netto</span><span>'+eur(su.netto)+'</span></div><div><span class="muted">19 % USt</span><span>'+eur(su.mwst)+'</span></div>'
        :'<div><span class="muted">Summe</span><span>'+eur(su.netto)+'</span></div>')+
      '<div class="total"><span>Zu zahlen</span><span>'+eur(su.brutto)+'</span></div></div>'+
      (st.mwst==='klein'?'<div class="note">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>':'')+
      (st.mwst==='privat'?'<div class="note"><strong>Achtung:</strong> In den Einstellungen steht „Privat". Für eine echte Rechnung dort auf Kleinunternehmer oder gewerblich umstellen.</div>':'')+
      '</div><div class="card" style="margin-top:12px"><h2>Pflichtangaben § 14 UStG</h2><ul class="check">'+
      ['Name des Betriebs','Vollständige Anschrift','Steuernummer oder USt-IdNr.','Name des Empfängers']
        .map(x=>'<li class="'+(miss.includes(x)?'miss':'')+'">'+esc(x)+'</li>').join('')+
      '<li>Rechnungsnummer, fortlaufend</li><li>Leistungsdatum</li><li>Art und Umfang der Leistung</li>'+
      (st.mwst==='gewerblich'?'<li>Steuersatz und Steuerbetrag</li>':'<li>Hinweis auf § 19 UStG</li>')+
      '</ul>'+(miss.length?'<div class="hint">Fehlendes in den Einstellungen nachtragen.</div>':'<div class="hint">Vollständig.</div>')+'</div>';
  }
  h+='<div class="row" style="margin-top:12px"><button class="primary" data-a="copy">Als Text kopieren</button>'+
     '<span class="small muted" id="copy-hint"></span></div>';
  return h;
}

/* ---------- Zeichnen ---------- */
function render(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.v===S.view)));
  const m=document.getElementById('main');
  m.innerHTML = S.view==='kalender'?renderKalender()
    : S.view==='auftrag'?renderAuftrag()
    : S.view==='preisbuch'?renderPreisbuch()
    : S.view==='dokument'?renderDokument()
    : renderEinstellungen();
  save();
}

/* ---------- Timer-Anzeige ---------- */
setInterval(()=>{
  const a=auftrag(); if(!a) return;
  a.positionen.forEach(p=>{
    if(p.typ==='arbeit'&&p.start){
      const el=document.querySelector('[data-live="'+p.id+'"]');
      if(el){
        const s=Math.floor((Date.now()-p.start)/1000);
        el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+' läuft';
      }
    }
  });
},1000);

/* ---------- Eingaben ---------- */
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
function hint(id,txt){const el=document.getElementById(id);if(el)el.innerHTML=txt}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const act=b.dataset.a, id=b.dataset.id, a=auftrag();

  if(act==='tab'){S.view=b.dataset.v;render();return}
  if(act==='docart'){S.docArt=b.dataset.v;render();return}

  if(act==='t-schaetz'){
    const s=schaetze(val('t-arbeit'),klasseVon(val('t-fahrzeug')));
    if(!s){hint('t-hint','Für „'+esc(val('t-arbeit'))+'" habe ich keinen Erfahrungswert. Dauer selbst eintragen.');return}
    const d=document.getElementById('t-dauer'); if(d) d.value=s.min;
    hint('t-hint','<strong>'+esc(s.job.n)+'</strong> bei '+esc(s.klasse.n)+': rund <strong class="num">'+s.min+' min</strong> (typisch '+s.von+'–'+s.bis+' min). Schätzung — bitte prüfen.');
    return;
  }
  if(act==='t-add'){
    const datum=val('t-datum')||iso(new Date());
    S.termine.push({id:uid(),datum,zeit:val('t-zeit')||'09:00',kunde:val('t-kunde'),fahrzeug:val('t-fahrzeug'),
      arbeit:val('t-arbeit'),dauer:Number(val('t-dauer'))||60,status:'offen',auftragId:null});
    render();return;
  }
  if(act==='t-del'){S.termine=S.termine.filter(t=>t.id!==id);render();return}
  if(act==='t-done'){
    const t=S.termine.find(x=>x.id===id); if(t) t.status=t.status==='erledigt'?'offen':'erledigt';
    render();return;
  }
  if(act==='t-auftrag'){
    const t=S.termine.find(x=>x.id===id); if(!t) return;
    if(!t.auftragId){
      const pb=S.preisbuch.find(p=>norm(p.name)===norm(t.arbeit));
      const teile=(pb?pb.teile:[]).map(x=>({id:uid(),typ:'teil',name:x.name,preis:x.preis,menge:x.menge}));
      const fzTxt=t.fahrzeug||'';
      const teil=fzTxt.split(/[, ]+/);
      const na={id:uid(),kunde:t.kunde,datum:t.datum,
        fahrzeug:{hersteller:teil[0]||'',modell:teil.slice(1).filter(x=>!/^\d{4}$/.test(x)).join(' '),
          jahr:(fzTxt.match(/\b(19|20)\d{2}\b/)||[''])[0],klasse:klasseVon(fzTxt),kennzeichen:'',km:''},
        positionen:[{id:uid(),typ:'arbeit',name:t.arbeit||'Arbeit',dauer:Number(t.dauer)||60,
          satzId:(pb?pb.satzId:S.settings.saetze[0].id),ist:null,start:null},...teile]};
      S.auftraege.push(na); t.auftragId=na.id;
    }
    S.aktiv=t.auftragId; S.view='auftrag'; render(); return;
  }

  if(act==='a-neu'){
    const na={id:uid(),kunde:'',datum:iso(new Date()),
      fahrzeug:{hersteller:'',modell:'',jahr:'',klasse:'kompakt',kennzeichen:'',km:''},positionen:[]};
    S.auftraege.push(na); S.aktiv=na.id; S.view='auftrag'; render(); return;
  }
  if(act==='pb-add'&&a){
    const p=S.preisbuch.find(x=>x.id===id); if(!p) return;
    a.positionen.push({id:uid(),typ:'arbeit',name:p.name,dauer:p.dauer,satzId:p.satzId,ist:null,start:null});
    (p.teile||[]).forEach(t=>a.positionen.push({id:uid(),typ:'teil',name:t.name,preis:t.preis,menge:t.menge}));
    render();return;
  }
  if(act==='schaetz'&&a){
    const s=schaetze(val('n-arbeit'),a.fahrzeug.klasse);
    if(!s){hint('s-hint','Für „'+esc(val('n-arbeit'))+'" habe ich keinen Erfahrungswert. Dauer selbst eintragen.');return}
    const d=document.getElementById('n-dauer'); if(d) d.value=s.min;
    hint('s-hint','<strong>'+esc(s.job.n)+'</strong> bei '+esc(s.klasse.n)+' (×'+String(s.klasse.f).replace('.',',')+'): rund <strong class="num">'+s.min+' min</strong>, typisch '+s.von+'–'+s.bis+' min. Schätzung — bitte prüfen.');
    return;
  }
  if(act==='arbeit-add'&&a){
    const n=val('n-arbeit'); if(!n){hint('s-hint','Erst eine Arbeit eintragen.');return}
    const dauer=Number(val('n-dauer'))|| (schaetze(n,a.fahrzeug.klasse)||{min:60}).min;
    a.positionen.push({id:uid(),typ:'arbeit',name:n,dauer,satzId:val('n-satz')||S.settings.saetze[0].id,ist:null,start:null});
    render();return;
  }
  if(act==='ins-preisbuch'&&a){
    const n=val('n-arbeit'); if(!n){hint('s-hint','Erst eine Arbeit eintragen.');return}
    S.preisbuch.push({id:uid(),name:n,dauer:Number(val('n-dauer'))||60,satzId:val('n-satz')||S.settings.saetze[0].id,teile:[]});
    hint('s-hint','„'+esc(n)+'" ist jetzt im Preisbuch.');save();return;
  }
  if(act==='teil-add'&&a){
    const n=val('n-tname'); if(!n) return;
    a.positionen.push({id:uid(),typ:'teil',name:n,preis:Number(val('n-tpreis').replace(',','.'))||0,menge:Number(val('n-tmenge'))||1});
    render();return;
  }
  if(act==='pos-del'&&a){a.positionen=a.positionen.filter(p=>p.id!==id);render();return}
  if(act==='timer'&&a){
    const p=a.positionen.find(x=>x.id===id); if(!p) return;
    if(p.start){p.ist=Math.max(1,Math.round((Date.now()-p.start)/60000));p.start=null}
    else p.start=Date.now();
    render();return;
  }
  if(act==='ist-uebernehmen'&&a){
    const p=a.positionen.find(x=>x.id===id); if(!p||p.ist==null) return;
    const pb=S.preisbuch.find(x=>norm(x.name)===norm(p.name));
    if(pb) pb.dauer=Math.round(p.ist); else S.preisbuch.push({id:uid(),name:p.name,dauer:Math.round(p.ist),satzId:p.satzId,teile:[]});
    p.dauer=Math.round(p.ist); render(); return;
  }

  if(act==='pb-neu'){
    const n=val('p-name'); if(!n){hint('p-hint','Erst eine Arbeit eintragen.');return}
    S.preisbuch.push({id:uid(),name:n,dauer:Number(val('p-dauer'))||(schaetze(n,'kompakt')||{min:60}).min,
      satzId:val('p-satz')||S.settings.saetze[0].id,teile:[]});
    render();return;
  }
  if(act==='p-schaetz'){
    const s=schaetze(val('p-name'),'kompakt');
    if(!s){hint('p-hint','Kein Erfahrungswert für „'+esc(val('p-name'))+'".');return}
    const d=document.getElementById('p-dauer'); if(d) d.value=s.min;
    hint('p-hint','<strong>'+esc(s.job.n)+'</strong>, Kompaktklasse: rund <strong class="num">'+s.min+' min</strong>. Im Auftrag wird nach Fahrzeugklasse umgerechnet.');
    return;
  }
  if(act==='pb-del'){S.preisbuch=S.preisbuch.filter(p=>p.id!==id);render();return}
  if(act==='satz-neu'){S.settings.saetze.push({id:uid(),name:'Neuer Satz',rate:60});render();return}
  if(act==='satz-del'){S.settings.saetze=S.settings.saetze.filter(s=>s.id!==id);render();return}
  if(act==='reset'){S=seed();render();return}
  if(act==='leeren'){
    S.termine=[];S.auftraege=[];S.aktiv=null;S.settings.beispiel=false;render();return;
  }
  if(act==='copy'){
    const a2=auftrag(); if(!a2) return;
    const su=summe(a2);
    const kopf=S.docArt==='privat'?'KOSTENAUFSTELLUNG (private Hilfeleistung, keine Umsatzsteuer)':'RECHNUNG '+S.settings.rnrPrefix+String(S.settings.rnrNext).padStart(3,'0');
    const txt=[kopf,'',
      'Datum: '+datumLang(a2.datum),'Kunde: '+(a2.kunde||'—'),
      'Fahrzeug: '+[a2.fahrzeug.hersteller,a2.fahrzeug.modell,a2.fahrzeug.jahr].filter(Boolean).join(' '),'',
      ...a2.positionen.map(p=>p.typ==='arbeit'
        ? '- '+p.name+': '+p.dauer+' min x '+eur(satz(p.satzId).rate)+'/h = '+eur((Number(p.dauer)||0)/60*satz(p.satzId).rate)
        : '- '+p.name+': '+(Number(p.menge)||1)+' x '+eur(p.preis)+' = '+eur((Number(p.preis)||0)*(Number(p.menge)||1))),
      '','Arbeit: '+eur(su.arbeit)+' ('+std(su.minuten)+')','Teile: '+eur(su.teile),
      (S.settings.mwst==='gewerblich'?'Netto: '+eur(su.netto)+'\n19 % USt: '+eur(su.mwst):''),
      'Gesamt: '+eur(su.brutto)].filter(x=>x!=='').join('\n');
    const done=()=>{const el=document.getElementById('copy-hint');if(el)el.textContent='Kopiert.'};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(()=>{
        const el=document.getElementById('copy-hint'); if(el) el.textContent='Kopieren ging nicht — Text unten markieren.';
        const pre=document.createElement('textarea'); pre.value=txt; pre.rows=12; pre.style.marginTop='10px';
        b.parentNode.appendChild(pre); pre.select();
      });
    } else done();
    return;
  }
});

document.addEventListener('change',e=>{
  const t=e.target, a=auftrag();
  if(t.dataset.f&&a){
    const f=t.dataset.f;
    if(f.startsWith('fz.')) a.fahrzeug[f.slice(3)]=t.value; else a[f]=t.value;
    save(); if(f==='fz.klasse') render(); return;
  }
  if(t.dataset.s){
    const s=S.settings.saetze.find(x=>x.id===t.dataset.id);
    if(s) s[t.dataset.s]=t.dataset.s==='rate'?(Number(t.value)||0):t.value;
    save(); render(); return;
  }
  if(t.dataset.o){S.settings.oeffnung[t.dataset.o]=t.value;save();render();return}
  if(t.dataset.b){
    const k=t.dataset.b;
    if(k.startsWith('betrieb.')) S.settings.betrieb[k.slice(8)]=t.value; else S.settings[k]=t.value;
    save(); return;
  }
  if(t.dataset.a==='mwst'){S.settings.mwst=t.value;save();render();return}
});

render();
</script>
